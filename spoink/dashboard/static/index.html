<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>spoink</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <h1 class="logo">spoink</h1>
        <span class="tag">snapshot engine</span>
      </div>

      <nav class="tabs">
        <button data-tab="sources" class="active">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="8" cy="3.6" rx="5.3" ry="2"/><path d="M2.7 3.6v8.8c0 1.1 2.4 2 5.3 2s5.3-.9 5.3-2V3.6"/><path d="M2.7 8c0 1.1 2.4 2 5.3 2s5.3-.9 5.3-2"/></svg>
          <span>Sources</span>
        </button>
        <button data-tab="runs">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8h2.7l2-5 3 10 2-5h2.8"/></svg>
          <span>Runs</span><span id="runBadge" class="badge" hidden>0</span>
        </button>
        <button data-tab="tasks">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.6 13.7 5v6L8 14.4 2.3 11V5z"/><path d="M2.4 5 8 8.3 13.6 5M8 8.3v6.1"/></svg>
          <span>Task&nbsp;Creator</span>
        </button>
      </nav>

      <div class="side-t">
        <label for="globalT">incident T</label>
        <div class="side-t-in">
          <input id="globalT" type="datetime-local" step="60" />
          <span class="utc">UTC</span>
        </div>
      </div>

      <div class="side-foot">capture · slice · build</div>
    </aside>

    <main>
      <!-- SOURCES -->
      <section id="tab-sources" class="tab active">
        <p class="hint">Capture a source as of <strong>T</strong>. Credentials come from <code>.env</code>.</p>
        <div id="sourceList" class="source-list"></div>
      </section>

      <!-- RUNS -->
      <section id="tab-runs" class="tab">
        <div class="grp-row">
          <h2 class="grp">Running</h2>
          <button id="refresh" class="ghost sm">refresh</button>
        </div>
        <div id="running" class="runs"></div>
        <p id="runningEmpty" class="muted sm">Nothing running.</p>
        <h2 class="grp">Completed</h2>
        <div id="completed" class="runs"></div>
        <p id="completedEmpty" class="muted sm">No completed runs yet — capture a source.</p>
      </section>

      <!-- TASK CREATOR -->
      <section id="tab-tasks" class="tab">
        <p class="hint">Bundle sliced surfaces @ <strong>T</strong> into an agent-eval task.</p>
        <div class="task-grid">
          <div class="panel">
            <h2 class="grp">1 · pick surfaces @ T</h2>
            <div id="taskRuns" class="picklist"></div>
          </div>
          <div class="panel">
            <h2 class="grp">2 · code anchor</h2>
            <div class="field"><label>SUT repo</label><input id="anchorRepo" placeholder="abundant-ai/oddish" /></div>
            <div class="field"><label>incident-tip commit</label><input id="anchorSha" placeholder="16595d17… (main @ T)" /></div>
            <div class="field"><label>resolution PR (for the verifier)</label><input id="anchorPr" placeholder="#468" /></div>
            <button id="genPlan">generate plan</button>
            <div id="planOut" class="plan" hidden></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
