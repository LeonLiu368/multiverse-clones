schema_version = "1.2"
name = "abundant-slack-clone/example-incident-triage"
description = "Drop-in Slack workspace; the agent triages an incident thread and posts the root cause via slack-cli."

[metadata]
category = "knowledge-work"
service = "slack"
tags = ["slack-clone", "multi-service", "cli", "triage"]

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
workdir = "/app"
build_timeout_sec = 1200
