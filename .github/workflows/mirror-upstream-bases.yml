name: mirror-upstream-bases

# Mirror the two PRIVATE abundant-ai base images that jira/slack build FROM into THIS repo owner's
# GHCR namespace, so the clones can be published + run entirely from the owner's registry.
#
# SAFETY: this workflow only ever READS from ghcr.io/abundant-ai and only ever WRITES to
# ghcr.io/<owner> (lowercased). It never pushes, retags, or deletes anything under abundant-ai.
# An explicit guard below aborts if a destination is ever not in the owner namespace.
#
# Requires a secret GHCR_MIRROR_TOKEN: a PAT with read:packages on abundant-ai AND write:packages on
# the owner. (The default GITHUB_TOKEN can write the owner's packages but cannot read abundant-ai's
# private packages, so a PAT is required for the read side.)
#
# Run this ONCE (and whenever the upstream bases change) before publish-jira-slack.yml.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - src: ghcr.io/abundant-ai/ticketvector-service:latest
            name: ticketvector-service
            tag: latest
          - src: ghcr.io/abundant-ai/slack-seed:eng-2021q1
            name: slack-seed
            tag: eng-2021q1
    steps:
      - name: Compute owner namespace (lowercased)
        id: ns
        run: echo "ns=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (read abundant-ai + write owner)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_MIRROR_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Mirror ${{ matrix.image.name }} -> owner namespace (READ abundant-ai, WRITE owner only)
        env:
          SRC: ${{ matrix.image.src }}
          DEST: ${{ steps.ns.outputs.ns }}/${{ matrix.image.name }}:${{ matrix.image.tag }}
        run: |
          set -euo pipefail
          # Hard guard: never write outside the owner namespace; never write to abundant-ai.
          case "$DEST" in
            "${{ steps.ns.outputs.ns }}/"*) : ;;
            *) echo "::error::Refusing to push to non-owner destination: $DEST"; exit 1 ;;
          esac
          case "$DEST" in
            *ghcr.io/abundant-ai/*) echo "::error::Destination is under abundant-ai — aborting"; exit 1 ;;
          esac
          echo "Mirroring (read-only source): $SRC  ->  $DEST"
          # imagetools copies the manifest (multi-arch preserved) src->dest without mutating src.
          docker buildx imagetools create -t "$DEST" "$SRC"
          docker buildx imagetools inspect "$DEST" | head -20
