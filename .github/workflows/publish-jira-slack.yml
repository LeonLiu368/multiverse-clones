name: publish-jira-slack

# Publish multiverse-clones' standard builds of the jira + slack gateways under DISTINCT `-mv` package
# names (jira-gateway-mv, slack-service-mv, slack-gateway-mv) owned by THIS repo — coexisting with the
# canonical jira-gateway / slack-* packages (owned by abundant-jira-clone / abundant-slack-clone), never
# overwriting them.
#
# Bases are pulled from the in-org abundant-ai originals (ticketvector-service, slack-seed) — the repo
# is in the org, so the mirror workflow is obsolete. If GITHUB_TOKEN can't READ those private base
# packages (they're owned by other repos), this build fails on the FROM pull — that's the known
# cross-repo access caveat; grant read or use a PAT then.
#
# All builds linux/amd64 (the ticketvector base is amd64-only). Dispatch-only.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NS: ghcr.io/abundant-ai
  SRC_LABEL: org.opencontainers.image.source=https://github.com/abundant-ai/multiverse-clones

jobs:
  jira:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build & push jira-gateway-mv:{empty,prod-v1} FROM in-org ticketvector (amd64)
        env:
          CTX: clones/abundant-jira-clone/selfcontained/base
        run: |
          set -euo pipefail
          TV="$NS/ticketvector-service:latest"
          docker buildx build --platform linux/amd64 --label "$SRC_LABEL" --build-arg TICKETVECTOR_SERVICE="$TV" \
            -f "$CTX/Dockerfile.empty"   -t "$NS/jira-gateway-mv:empty"   --push "$CTX"
          docker buildx build --platform linux/amd64 --label "$SRC_LABEL" --build-arg TICKETVECTOR_SERVICE="$TV" \
            -f "$CTX/Dockerfile.gateway" -t "$NS/jira-gateway-mv:prod-v1" --push "$CTX"
      - name: Build & push jira-agent-mv (FROM in-org ticketvector; world_issues stripped)
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --label "$SRC_LABEL" \
            -f clones/abundant-jira-clone/selfcontained/base/Dockerfile.agent \
            -t "$NS/jira-agent-mv:latest" --push clones/abundant-jira-clone

  slack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build & push slack-service-mv (standalone base, amd64)
        env:
          CTX: clones/abundant-slack-clone/selfcontained/base
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --label "$SRC_LABEL" \
            -f "$CTX/Dockerfile.service" -t "$NS/slack-service-mv:latest" --push "$CTX"
      - name: Build & push slack-gateway-mv:{empty,prod-v1} FROM our slack-service-mv + in-org seed (amd64)
        env:
          CTX: clones/abundant-slack-clone/selfcontained/base
        run: |
          set -euo pipefail
          SVC="$NS/slack-service-mv:latest"
          SEED="$NS/slack-seed:eng-2021q1"
          docker buildx build --platform linux/amd64 --label "$SRC_LABEL" --build-arg SLACK_SERVICE="$SVC" \
            -f "$CTX/Dockerfile.empty"   -t "$NS/slack-gateway-mv:empty"   --push "$CTX"
          docker buildx build --platform linux/amd64 --label "$SRC_LABEL" --build-arg SLACK_SERVICE="$SVC" --build-arg SEED="$SEED" \
            -f "$CTX/Dockerfile.gateway" -t "$NS/slack-gateway-mv:prod-v1" --push "$CTX"
      - name: Build & push slack-agent-mv (FROM our slack-service-mv)
        env:
          CTX: clones/abundant-slack-clone/selfcontained/base
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --label "$SRC_LABEL" --build-arg SLACK_SERVICE="$NS/slack-service-mv:latest" \
            -f "$CTX/Dockerfile.agent" -t "$NS/slack-agent-mv:latest" --push "$CTX"
