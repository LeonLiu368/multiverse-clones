name: publish-images

# Build each clone's gateway image trio (base / :empty / :prod-v1) and publish to the
# repo OWNER's GHCR namespace (ghcr.io/<owner>, lowercased — i.e. ghcr.io/leonliu368 for this
# fork). Images are pushed PUBLIC (best-effort auto-flip + a documented one-time manual fallback).
#
# Scope: the 8 clones whose images build standalone. jira + slack are handled SEPARATELY by
# publish-jira-slack.yml because their builds are bespoke (external private base + multi-image) and
# depend on mirror-upstream-bases.yml having mirrored ghcr.io/abundant-ai/{ticketvector-service,
# slack-seed} into the owner namespace first. Nothing here ever writes to abundant-ai.

on:
  push:
    branches: [main]
    paths:
      - "clones/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: build only this clone (dir name). Empty = all."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - clone: notion-clone
            service: notion-service
            context: clones/notion-clone
            base_file: docker/Dockerfile
            empty_file: docker/Dockerfile.empty
            prodv1_file: docker/Dockerfile.prod-v1
            corpus_prep: ""
            platforms: linux/amd64,linux/arm64
          - clone: figma-clone
            service: figma-service
            context: clones/figma-clone
            base_file: docker/Dockerfile
            empty_file: docker/Dockerfile.empty
            prodv1_file: docker/Dockerfile.prod-v1
            corpus_prep: 'pip install -e ".[mcp]" && python scripts/build_corpus.py --out figma_corpus.db'
            platforms: linux/amd64,linux/arm64
          - clone: google-workspace-clone
            service: gworkspace-service
            context: clones/google-workspace-clone/docker
            base_file: Dockerfile
            empty_file: Dockerfile
            prodv1_file: Dockerfile.prod-v1
            corpus_prep: ""        # gws_corpus.db is committed under docker/
            platforms: linux/amd64,linux/arm64
          - clone: sentry-clone
            service: sentry-clone-service
            context: clones/sentry-clone
            base_file: Dockerfile.service
            empty_file: Dockerfile.empty
            prodv1_file: Dockerfile.prod-v1
            corpus_prep: ""        # corpus/state.json committed
            platforms: linux/amd64,linux/arm64
          - clone: gauge
            service: gauge-service
            context: clones/gauge
            base_file: Dockerfile.service
            empty_file: Dockerfile.service
            prodv1_file: Dockerfile.prod-v1
            corpus_prep: ""        # examples/data/gauge/state.json committed
            platforms: linux/amd64,linux/arm64
          - clone: abundant-logfire-clone
            service: logfire-service
            context: clones/abundant-logfire-clone
            base_file: docker/Dockerfile
            empty_file: docker/Dockerfile.empty
            prodv1_file: docker/Dockerfile.prod-v1
            corpus_prep: ""        # corpus/records.json.gz committed
            platforms: linux/amd64,linux/arm64
          - clone: gh-cli-clone
            service: ghc-service
            context: clones/gh-cli-clone
            base_file: selfcontained/gateway/Dockerfile
            empty_file: selfcontained/gateway/Dockerfile
            prodv1_file: selfcontained/gateway/Dockerfile.prod-v1
            corpus_prep: ""        # prod-v1 bakes a seeded Forgejo data dir at build time
            platforms: linux/amd64   # Forgejo bake under QEMU arm64 is impractically slow
          - clone: aws-clone
            service: aws-clone-service
            context: clones/aws-clone
            base_file: Dockerfile.service
            empty_file: Dockerfile.empty
            prodv1_file: Dockerfile.prod-v1
            corpus_prep: ""        # examples/data/aws-clone/state.json committed
            platforms: linux/amd64   # LocalStack base; pin amd64 for reliability

    steps:
      - name: Skip if a single-clone dispatch filter excludes this clone
        id: gate
        run: |
          only="${{ github.event.inputs.only }}"
          if [ -n "$only" ] && [ "$only" != "${{ matrix.clone }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "skipping ${{ matrix.clone }} (filter=$only)"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Lowercase owner -> registry namespace
        if: steps.gate.outputs.run == 'true'
        id: ns
        run: echo "ns=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.gate.outputs.run == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.run == 'true'

      - name: Log in to GHCR
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Corpus prep (only clones that generate their baked corpus)
        if: steps.gate.outputs.run == 'true' && matrix.corpus_prep != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build baked corpus
        if: steps.gate.outputs.run == 'true' && matrix.corpus_prep != ''
        working-directory: clones/${{ matrix.clone }}
        run: |
          python -m pip install --upgrade pip
          bash -c '${{ matrix.corpus_prep }}'

      - name: Build & push BASE + :empty (multi-arch)
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.base_file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ steps.ns.outputs.ns }}/${{ matrix.service }}:latest
            ${{ steps.ns.outputs.ns }}/${{ matrix.service }}:empty

      - name: Build & push :prod-v1 (FROM :empty, multi-arch)
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.prodv1_file }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: |
            BASE=${{ steps.ns.outputs.ns }}/${{ matrix.service }}:empty
          tags: |
            ${{ steps.ns.outputs.ns }}/${{ matrix.service }}:prod-v1

      - name: Visibility reminder (owner flips to Public once, manually)
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "::notice::Published ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:{latest,empty,prod-v1}."
          echo "::notice::First publish creates a PRIVATE package — flip it to Public once in GitHub -> Packages -> ${{ matrix.service }} -> Package settings -> Change visibility -> Public."
