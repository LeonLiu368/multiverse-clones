# Build and publish the single, pullable figma-service image to GHCR.
#
# Oddish/Harbor tasks pull this image as their `figma` service and mount their own
# fixture.json into it (see oddish/tasks/*/environment/docker-compose.yaml). Pin
# `sha-<commit>` (or the digest) in task packs for reproducibility; use `latest`
# only for local prototyping.
name: figma-service-image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "docker/**"
      - ".github/workflows/figma-service-image.yml"
  workflow_dispatch: {}

env:
  # Match the image name task composes reference. Change in lockstep with the tasks.
  IMAGE: ghcr.io/abundant-ai/figma-service

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
