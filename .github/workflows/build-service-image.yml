name: build-service-image

# Rebuild and push the single slack-service image (the prebuilt backend every task pulls) on every
# push to main. Tasks reference ghcr.io/abundant-ai/slack-service:latest and are never rebuilt here.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/abundant-ai/slack-service

jobs:
  build-and-push:
    # ubuntu-latest is native x86_64 → no QEMU. Mattermost is amd64-only, so this avoids slow
    # emulated builds. Both the service and the agent containers pin platform: linux/amd64.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag :latest ONLY on main. On any other branch (workflow_dispatch), push a branch-scoped tag
      # + the sha — so feature branches can build a runnable image WITHOUT clobbering the shared
      # :latest that other experiments (e.g. three-surface-ops) depend on.
      - name: Compute tags
        id: tags
        run: |
          SAFE="$(echo "${{ github.ref_name }}" | tr '/' '-')"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=${IMAGE}:latest,${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${SAFE},${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push slack-service
        uses: docker/build-push-action@v6
        with:
          context: selfcontained/base
          file: selfcontained/base/Dockerfile.service
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# One-time after the first successful run: set the slack-service package visibility to PUBLIC in
# GitHub → org packages, so Modal/Oddish pull it without credentials. (If kept private, give the
# runner a read:packages registry secret instead.) Also confirm the abundant-ai org Packages
# policy allows publishing, or the first push 403s.
