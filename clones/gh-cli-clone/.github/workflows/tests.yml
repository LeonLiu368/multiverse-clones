name: Tests

on:
  push:
    branches: [ main ]
    paths:
      - ghclone/**
      - tests/**
      - selfcontained/gateway/**
      - pyproject.toml
      - .github/workflows/tests.yml
  pull_request:
    paths:
      - ghclone/**
      - tests/**
      - selfcontained/gateway/**
      - pyproject.toml
      - .github/workflows/tests.yml
  workflow_dispatch:

jobs:
  offline:
    name: Offline suite (unit + parity/isolation skips)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: pip install -e '.[dev]'
      - name: Offline pytest
        # Unit + CLI/MCP wiring + hydrate + actions overlay; the live halves of
        # test_parity.py / test_integration.py skip without GHC_HOST. The
        # always-on isolation assertions (no on-disk state) run here.
        run: pytest tests/test_smoke.py tests/test_cli_unit.py tests/test_hydrate_unit.py
                    tests/test_actions_overlay.py tests/test_parity.py tests/test_isolation.py -q

  live:
    name: Live suite vs gateway (parity + integration green from cold boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: pip install -e '.[dev]'
      - name: Build gateway (prod-v1, corpus baked)
        run: |
          docker build -f selfcontained/gateway/Dockerfile -t ghc-service:ci .
          docker build -f selfcontained/gateway/Dockerfile.prod-v1 \
            --build-arg BASE=ghc-service:ci -t ghc-service:ci-prod-v1 .
      - name: Boot gateway mount-free
        run: |
          docker run -d --name gw -p 3399:80 ghc-service:ci-prod-v1
          for i in $(seq 1 60); do
            docker exec gw curl -fsS http://localhost/api/healthz >/dev/null 2>&1 && break || sleep 1
          done
          echo "GHC_TOKEN=$(docker exec gw cat /shared/token)" >> "$GITHUB_ENV"
          echo "GHC_HOST=http://localhost:3399" >> "$GITHUB_ENV"
      - name: Verify baked corpus serves mount-free
        run: |
          docker exec gw sh -c 'GH_HOST=http://localhost GH_TOKEN=$(cat /shared/token) gh api repos/acme/webapp' \
            | python3 -c 'import sys,json;assert json.load(sys.stdin)["full_name"]=="acme/webapp";print("baked corpus OK")'
      - name: Live pytest (parity + client + integration)
        run: pytest tests/test_parity.py tests/test_client.py tests/test_integration.py -q
