name: Publish Service Image

on:
  push:
    branches:
      - main
    paths:
      - ghclone/**
      - selfcontained/gateway/**
      - scripts/images.sh
      - pyproject.toml
      - README.md
      - docs/task-integration.md
      - .github/workflows/publish-images.yml
  pull_request:
    paths:
      - ghclone/**
      - selfcontained/gateway/**
      - scripts/images.sh
      - pyproject.toml
      - README.md
      - docs/task-integration.md
      - .github/workflows/publish-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/abundant-ai/ghc-service
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    name: Build & publish ghc-service trio (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- base: ghc-service {latest,:<sha>,:empty} ----
      - name: Metadata (base)
        id: meta-base
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=empty,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ghc Service
            org.opencontainers.image.description=GitHub-compatible Forgejo gateway with gh CLI/MCP and Actions runner for offline tasks

      - name: Build & push base (multi-arch)
        id: base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: selfcontained/gateway/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- prod-v1: corpus DB baked in (built FROM the base) ----
      # On PRs the base isn't pushed, so build prod-v1 FROM the local base ref via
      # the same build context (buildx resolves the ARG against the freshly built
      # base only when pushed). On main, BASE points at the pushed :latest.
      - name: Build & push prod-v1 (multi-arch, corpus baked)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: selfcontained/gateway/Dockerfile.prod-v1
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            BASE=${{ env.IMAGE_NAME }}:latest
          push: true
          tags: ${{ env.IMAGE_NAME }}:prod-v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify multi-arch manifests
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:latest
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:prod-v1
