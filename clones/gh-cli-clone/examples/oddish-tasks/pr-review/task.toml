version = "1.0"
[task]
name = "ghc-world/pr-review"
description = "Review an open PR: check it out, inspect the diff, request changes by closing, then reopen."
[metadata]
category = "swe"
tags = ["gh","pr","review","realistic","isolated","multi-container"]
[verifier]
timeout_sec = 300.0
[agent]
timeout_sec = 900.0
[environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 3072
storage_mb = 12288
gpus = 0
allow_internet = true
workdir = "/app"
[environment.healthcheck]
command = "gh auth status"
interval_sec = 5.0
timeout_sec = 30.0
start_period_sec = 15.0
retries = 60
