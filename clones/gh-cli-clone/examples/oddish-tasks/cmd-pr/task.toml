version = "1.0"
[task]
name = "ghc-world/cmd-pr"
description = "Exercise the full PR surface: fork, clone, branch, push, PR, review, merge."
[metadata]
category = "tooling"
tags = ["gh","p0","pr","coverage","isolated","multi-container"]
[verifier]
timeout_sec = 300.0
[agent]
timeout_sec = 1200.0
[environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 3072
storage_mb = 12288
gpus = 0
allow_internet = true
workdir = "/app"
[environment.healthcheck]
command = "gh auth status"
interval_sec = 5.0
timeout_sec = 30.0
start_period_sec = 15.0
retries = 60
