version = "1.0"
[task]
name = "ghc/p0-open-issue"
description = "Use the gh CLI to open an issue on the forge (P0: issue create)."
[metadata]
category = "tooling"
difficulty = "easy"
tags = ["gh","p0","issue"]
build_strategy = "dockerfile_build"
[verifier]
timeout_sec = 300.0
[agent]
timeout_sec = 600.0
[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
workdir = "/app"
