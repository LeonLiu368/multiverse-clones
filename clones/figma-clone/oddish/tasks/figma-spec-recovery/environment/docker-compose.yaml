# Image-pull pattern — NO clone source in environment/. The figma gateway is PULLED as
# figma-service-mv:empty and seeded by the per-task fixture.json mount; the agent is FROM
# figma-agent-mv. No vendored figmaclone/, no figma.Dockerfile. (fixture.json is per-task data.)
services:
  main:
    environment:
      - FIGMA_API_URL=http://figma:3000
      - FIGMA_TOKEN=figma-clone-token
      - FIGMA_FILE_KEY=Pr1cingCardSpecFile001
    depends_on:
      figma:
        condition: service_healthy

  figma:
    image: ghcr.io/abundant-ai/figma-service-mv:empty
    environment:
      - FIGMA_FIXTURE=/srv/fixture.json
    volumes:
      - ./fixture.json:/srv/fixture.json:ro
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
