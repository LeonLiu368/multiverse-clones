name: Build Gauge Service Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/abundant-ai/gauge-service

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests

  image:
    name: Build service image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests

      - name: Build local service image
        run: docker build -f Dockerfile.service -t gauge-service:local .

      - name: Run compose smoke test
        run: |
          docker compose -f examples/docker-compose.yaml up -d
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/healthz
          GRAFANA_URL=http://localhost:3000 GRAFANA_TOKEN=test-token-acme-eval bin/gcx whoami --json
          GRAFANA_URL=http://localhost:3000 GRAFANA_TOKEN=test-token-acme-eval bin/gcx dashboards search payment --json
          GRAFANA_URL=http://localhost:3000 GRAFANA_TOKEN=test-token-acme-eval bin/gcx alert instances list --state firing --json
          GRAFANA_URL=http://localhost:3000 GRAFANA_TOKEN=test-token-acme-eval bin/gcx dashboards query-panel dash-payment-webhooks 1 --since 10m --json
          GRAFANA_URL=http://localhost:3000 GRAFANA_TOKEN=test-token-acme-eval bin/gcx metrics query -d prom-payments 'sum by (status_code)(increase(payment_gateway_responses_total{service="payments"}[5m]))' --since 1h --step 5m --json
          GRAFANA_URL=http://localhost:3000 GRAFANA_TOKEN=test-token-acme-eval bin/gcx logs query -d loki-payments '{service="payments"} |= "lock_conflict"' --since 1h --limit 20 --json
          GRAFANA_URL=http://localhost:3000 GRAFANA_TOKEN=test-token-acme-eval bin/gcx annotations create --dashboard dash-payment-webhooks --panel 1 --text "ci smoke annotation" --tags smoke,CI --json
          GRAFANA_URL=http://localhost:3000 GAUGE_ADMIN_TOKEN=test-admin-token-acme-eval bin/gaugectl mutations

      - name: Stop compose smoke test
        if: always()
        run: docker compose -f examples/docker-compose.yaml down -v

      - name: Run task-pack compose smoke test
        run: |
          docker compose -f examples/task-pack-compose/docker-compose.yaml up -d --build
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent test ! -e /data/gauge/state.json
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent sh -lc 'command -v gcx && command -v mcp-grafana && ! command -v gaugectl'
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent gcx dashboards search payment --json
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent gcx metrics query -d prom-payments 'sum by (status_code)(increase(payment_gateway_responses_total{service="payments"}[5m]))' --since 1h --step 5m --json
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent gcx logs query -d loki-payments '{service="payments"} |= "lock_conflict"' --since 1h --limit 20 --json
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent gcx annotations create --dashboard dash-payment-webhooks --panel 1 --text "task-pack ci annotation" --tags smoke,TASK-PACK --json
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T -e GRAFANA_URL=http://localhost -e GAUGE_ADMIN_TOKEN=test-admin-token-acme-eval gauge gaugectl mutations

      - name: Stop task-pack compose smoke test
        if: always()
        run: docker compose -f examples/task-pack-compose/docker-compose.yaml down -v

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Gauge Service
            org.opencontainers.image.description=Local Grafana-compatible observability service for agent benchmarks

      - name: Build and push service image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
