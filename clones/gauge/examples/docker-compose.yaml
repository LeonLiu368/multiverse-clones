services:
  gauge:
    build:
      context: ..
      dockerfile: Dockerfile.service
    image: gauge-service:local
    ports:
      - "3000:80"
    environment:
      GAUGE_STATE_FILE: /data/gauge/state.json
      GAUGE_RUNTIME_STATE_FILE: /var/lib/gauge/state.json
      GAUGE_ENABLE_ADMIN_API: "1"
      GAUGE_ADMIN_TOKEN: test-admin-token-acme-eval
      GRAFANA_SERVICE_ACCOUNT_TOKEN: test-token-acme-eval
      GRAFANA_TOKEN: test-token-acme-eval
    volumes:
      - ./data/gauge/state.json:/data/gauge/state.json:ro
      - gauge-runtime:/var/lib/gauge
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost/api/healthz', timeout=1).read()\""]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  gauge-runtime:
