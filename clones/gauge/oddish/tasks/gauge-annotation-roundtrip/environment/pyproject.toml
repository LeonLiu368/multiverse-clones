[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gauge"
version = "0.1.0"
description = "Local Grafana-compatible observability service for agent benchmarks."
requires-python = ">=3.10"
authors = [{name = "Abundant"}]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mcp>=1.2"]

[project.scripts]
gcx = "gauge.cli.gcx:main"
mcp-grafana = "gauge.cli.mcp_server:main"
gaugectl = "gauge.cli.gaugectl:main"

[tool.setuptools.packages.find]
include = ["gauge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
