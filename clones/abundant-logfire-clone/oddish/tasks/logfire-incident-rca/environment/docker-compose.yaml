# Image-pull pattern — NO clone source in environment/. The logfire gateway is PULLED as
# logfire-service:prod-v1 (telemetry corpus baked in, served mount-free); the agent is FROM
# logfire-agent-mv. No vendored logfire_clone/, no logfire.Dockerfile, no corpus/.
services:
  main:
    environment:
      - LOGFIRE_URL=http://logfire:80
      - LOGFIRE_TOKEN=test-token-acme-eval
      - LOGFIRE_MIN_TIMESTAMP=2026-06-24T00:00:00Z
    depends_on:
      logfire:
        condition: service_healthy

  logfire:
    image: ghcr.io/abundant-ai/logfire-service:prod-v1
    environment:
      - LOGFIRE_TOKEN=test-token-acme-eval
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
