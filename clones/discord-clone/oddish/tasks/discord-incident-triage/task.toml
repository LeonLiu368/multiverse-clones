schema_version = "1.2"
name = "discord-clone/discord-incident-triage"
description = "Read + write task on a Discord-clone guild (image-pull). The agent uses the discord CLI / discord-mcp (pulled discord-agent) against the pulled discord-service:prod-v1 gateway to recover the buried INC-4471 remediation (PRICING_CACHE_TTL=300) from #incidents history/search, fix checkout-service/config.py, and post a remediation notice to #deploys. The verifier reads the posted message back through the Discord API and checks the code. nop=0, oracle=1."

[metadata]
category = "software-engineering"
service = "discord"
clone = "discord-clone"
tools = ["discord", "discord-mcp"]
tags = ["discord", "tool-use", "read-write", "round-trip", "image-pull", "incident"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 300

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = true
workdir = "/workspace"
build_timeout_sec = 1800

[[environment.mcp_servers]]
name = "discord"
transport = "stdio"
command = "discord-mcp"
