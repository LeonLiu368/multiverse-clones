# Build and publish the discord-service image trio + the discord-agent to GHCR, multi-arch.
#
# Tasks pull `ghcr.io/abundant-ai/discord-service:{prod-v1,empty}` as their `discord`
# gateway (or rely on the build:+image: dual so no pull is needed) and build `main`
# FROM `ghcr.io/abundant-ai/discord-agent`. Pin a digest in task packs for
# reproducibility; use :latest only for local prototyping.
name: discord-service-image

on:
  push:
    branches: [main]
    paths:
      - "clones/discord-clone/src/**"
      - "clones/discord-clone/pyproject.toml"
      - "clones/discord-clone/docker/**"
      - "clones/discord-clone/discord_corpus.db"
      - "clones/discord-clone/tests/**"
      - "clones/discord-clone/.github/workflows/discord-service-image.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/abundant-ai/discord-service
  AGENT: ghcr.io/abundant-ai/discord-agent

defaults:
  run:
    working-directory: clones/discord-clone

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + run the unit suite (endpoint/CLI/MCP/parity + isolation)
        run: |
          pip install -e ".[dev]"
          bash tests/test.sh

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. the base discord-service (multi-arch)
      - name: Build & push base
        uses: docker/build-push-action@v6
        with:
          context: clones/discord-clone
          file: clones/discord-clone/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. :empty (mount target)
      - name: Build & push :empty
        uses: docker/build-push-action@v6
        with:
          context: clones/discord-clone
          file: clones/discord-clone/docker/Dockerfile.empty
          build-args: BASE=${{ env.IMAGE }}:sha-${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:empty

      # 3. :prod-v1 (corpus baked in)
      - name: Build & push :prod-v1
        uses: docker/build-push-action@v6
        with:
          context: clones/discord-clone
          file: clones/discord-clone/docker/Dockerfile.prod-v1
          build-args: BASE=${{ env.IMAGE }}:sha-${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:prod-v1

      # 4. the thin discord-agent (multi-arch; tools only, no api/ no seed/)
      - name: Build & push discord-agent
        uses: docker/build-push-action@v6
        with:
          context: clones/discord-clone
          file: clones/discord-clone/docker/Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.AGENT }}:latest
            ${{ env.AGENT }}:sha-${{ github.sha }}
