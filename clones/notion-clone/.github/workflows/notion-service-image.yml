# Build and publish the notion-service image trio to GHCR, multi-arch.
#
# Tasks pull `ghcr.io/abundant-ai/notion-service:{prod-v1,empty}` as their `notion`
# gateway (or rely on the build:+image: dual so no pull is needed). Pin a digest in
# task packs for reproducibility; use :latest only for local prototyping.
name: notion-service-image

on:
  push:
    branches: [main]
    paths:
      - "clones/notion-clone/src/**"
      - "clones/notion-clone/pyproject.toml"
      - "clones/notion-clone/docker/**"
      - "clones/notion-clone/notion_corpus.db"
      - "clones/notion-clone/.github/workflows/notion-service-image.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/abundant-ai/notion-service

defaults:
  run:
    working-directory: clones/notion-clone

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. the base notion-service (multi-arch)
      - name: Build & push base
        uses: docker/build-push-action@v6
        with:
          context: clones/notion-clone
          file: clones/notion-clone/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. :empty (mount target)
      - name: Build & push :empty
        uses: docker/build-push-action@v6
        with:
          context: clones/notion-clone
          file: clones/notion-clone/docker/Dockerfile.empty
          build-args: BASE=${{ env.IMAGE }}:sha-${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:empty

      # 3. :prod-v1 (corpus baked in)
      - name: Build & push :prod-v1
        uses: docker/build-push-action@v6
        with:
          context: clones/notion-clone
          file: clones/notion-clone/docker/Dockerfile.prod-v1
          build-args: BASE=${{ env.IMAGE }}:sha-${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:prod-v1
