schema_version = "1.2"
name = "notion-clone/notion-db-triage"
description = "Read + write task on a Notion-clone workspace (image-pull). The agent uses notion-cli / notion-mcp (pulled notion-agent) against the pulled notion-service:prod-v1 gateway to query the Tasks database, find 'Rotate prod database creds', set Status=Done + checkbox, and comment 'rotated'. The verifier reads state back through the Notion API. nop=0, oracle=1."

[metadata]
category = "software-engineering"
service = "notion"
clone = "notion-clone"
tools = ["notion-cli", "notion-mcp"]
tags = ["notion", "tool-use", "read-write", "round-trip", "image-pull"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 300

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = true
workdir = "/workspace"
build_timeout_sec = 1800

[[environment.mcp_servers]]
name = "notion"
transport = "stdio"
command = "notion-mcp"
