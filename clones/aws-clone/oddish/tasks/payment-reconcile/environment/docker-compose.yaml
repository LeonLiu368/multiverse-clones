# Merged on top of Harbor's base compose. Harbor auto-builds the `main` (agent)
# container from environment/Dockerfile; here we only OVERRIDE `main` (point it at
# the gateway + wait for health) and ADD the `aws` gateway service.
#
# No `networks:` — Harbor wires networking (and injects network_mode on `main` for
# the Modal/DinD provider, mutually exclusive with an explicit networks: key). The
# agent reaches the gateway by name at http://aws:4566.
#
# The `aws` service carries BOTH `build:` and `image:`. Harbor's docker provider
# runs `docker compose build` (building every service with a build section) then
# `up`; the build tags the `image:` name so `up` uses the local build and never
# pulls from a registry — no GHCR auth needed (R1.5). The `image:` name still
# matches the published ghcr.io/abundant-ai/aws-clone-service:empty for anyone who
# prefers to pull it.
#
# This task's corpus is provided PER TASK by mounting data/aws-clone/state.json into
# the `aws` service container ONLY — never into `main` — so the agent reaches the
# seeded state solely through the AWS CLI/MCP tools.
services:
  main:
    environment:
      - AWS_ENDPOINT_URL=http://aws:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      aws:
        condition: service_healthy

  aws:
    image: ghcr.io/abundant-ai/aws-clone-service:empty
    build:
      context: .
      dockerfile: aws.Dockerfile
    hostname: aws
    environment:
      - AWS_CLONE_STATE_FILE=/data/aws-clone/state.json
      - AWS_CLONE_RUNTIME_STATE_FILE=/var/lib/aws-clone/state.json
      - AWS_CLONE_ENABLE_ADMIN_API=1
      - AWS_CLONE_ADMIN_TOKEN=test-admin-token-acme-eval
      - AWS_ENDPOINT_URL=http://localhost:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./data/aws-clone/state.json:/data/aws-clone/state.json:ro
    expose:
      - "4566"
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health', timeout=1).read(); urllib.request.urlopen('http://localhost/api/healthz', timeout=1).read()\""]
      interval: 3s
      timeout: 3s
      retries: 120
      start_period: 20s
