[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-clone"
version = "0.1.0"
description = "LocalStack-backed AWS clone harness for agent benchmarks."
requires-python = ">=3.10"
authors = [{name = "Abundant"}]
readme = "README.md"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
# `pip install .[mcp]` brings the aws-mcp stdio server (FastMCP).
mcp = ["mcp>=1.0"]
dev = ["pytest>=8", "boto3>=1.34", "mcp>=1.0"]

[project.scripts]
aws-clonectl = "aws_clone.cli.aws_clonectl:main"
aws-mcp = "aws_clone.mcp.server:main"

[tool.setuptools.packages.find]
include = ["aws_clone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
