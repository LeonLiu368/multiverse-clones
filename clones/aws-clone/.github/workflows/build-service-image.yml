name: Build AWS Clone Service Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/abundant-ai/aws-clone-service

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests

  image:
    name: Build service image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests

      - name: Build local service image
        run: docker build -f Dockerfile.service -t aws-clone-service:local .

      - name: Run compose smoke test
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_CLONE_ADMIN_TOKEN: test-admin-token-acme-eval
        run: |
          docker compose -f examples/docker-compose.yaml up -d
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4566/_localstack/health >/dev/null && curl -sf http://localhost:4580/api/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:4566/_localstack/health
          curl -sf http://localhost:4580/api/healthz
          docker compose -f examples/docker-compose.yaml exec -T aws awslocal sts get-caller-identity
          docker compose -f examples/docker-compose.yaml exec -T aws awslocal s3 ls
          docker compose -f examples/docker-compose.yaml exec -T aws awslocal s3 cp s3://acme-payment-exports/exports/2026-06-07/manifest.json -
          docker compose -f examples/docker-compose.yaml exec -T aws awslocal sqs list-queues
          docker compose -f examples/docker-compose.yaml exec -T aws sh -lc 'QUEUE_URL=$(awslocal sqs get-queue-url --queue-name payment-webhook-retry --query QueueUrl --output text) && awslocal sqs receive-message --queue-url "$QUEUE_URL" --max-number-of-messages 10 --message-attribute-names All'
          docker compose -f examples/docker-compose.yaml exec -T aws awslocal dynamodb list-tables
          docker compose -f examples/docker-compose.yaml exec -T aws awslocal dynamodb get-item --table-name payment-idempotency --key '{"event_id":{"S":"evt_001"}}'
          docker compose -f examples/docker-compose.yaml exec -T aws awslocal logs describe-log-groups
          docker compose -f examples/docker-compose.yaml exec -T aws awslocal logs filter-log-events --log-group-name /aws/lambda/payment-webhook-worker --filter-pattern validation_conflict
          docker compose -f examples/docker-compose.yaml exec -T aws awslocal ssm get-parameter --name /payments/retry/max_attempts
          docker compose -f examples/docker-compose.yaml exec -T aws awslocal secretsmanager describe-secret --secret-id payments/provider/api-key
          docker compose -f examples/docker-compose.yaml exec -T aws awslocal events list-rules
          docker compose -f examples/docker-compose.yaml exec -T aws awslocal events list-targets-by-rule --rule nightly-ledger-close
          bin/aws-clonectl state

      - name: Stop compose smoke test
        if: always()
        run: docker compose -f examples/docker-compose.yaml down -v

      - name: Run task-pack compose smoke test
        run: |
          docker compose -f examples/task-pack-compose/docker-compose.yaml up -d --build
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent test ! -e /data/aws-clone/state.json
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent sh -lc 'command -v aws && command -v awslocal && ! command -v aws-clonectl'
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent awslocal sts get-caller-identity
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent awslocal s3 ls
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent awslocal s3 cp s3://acme-payment-exports/exports/2026-06-07/manifest.json -
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent awslocal sqs list-queues
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent awslocal dynamodb get-item --table-name payment-idempotency --key '{"event_id":{"S":"evt_001"}}'
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent awslocal logs filter-log-events --log-group-name /aws/lambda/payment-webhook-worker --filter-pattern validation_conflict
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent awslocal ssm get-parameter --name /payments/retry/max_attempts
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T agent awslocal secretsmanager describe-secret --secret-id payments/provider/api-key
          docker compose -f examples/task-pack-compose/docker-compose.yaml exec -T aws sh -lc 'AWS_CLONE_ADMIN_URL=http://localhost AWS_CLONE_ADMIN_TOKEN=test-admin-token-acme-eval aws-clonectl mutations'

      - name: Stop task-pack compose smoke test
        if: always()
        run: docker compose -f examples/task-pack-compose/docker-compose.yaml down -v

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=AWS Clone Service
            org.opencontainers.image.description=LocalStack-backed AWS-local task harness for agent benchmarks

      - name: Build and push service image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print pushed digest
        if: github.event_name != 'pull_request'
        run: echo "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
