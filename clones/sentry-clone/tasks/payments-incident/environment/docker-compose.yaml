# Image-pull pattern — NO clone source in environment/. The sentry gateway is PULLED as
# sentry-clone-service-mv:empty and seeded by the per-task fixture mount; agent is FROM
# sentry-clone-agent-mv. (fixture.json is per-task data.)
services:
  main:
    environment:
      - SENTRY_URL=http://sentry
      - SENTRY_AUTH_TOKEN=test-token-acme-eval
      - SENTRY_ORG=acme
    depends_on:
      sentry:
        condition: service_healthy

  sentry:
    image: ghcr.io/abundant-ai/sentry-clone-service-mv:empty
    hostname: sentry
    environment:
      - SENTRY_CLONE_STATE_FILE=/data/sentry-clone/state.json
      - SENTRY_CLONE_RUNTIME_STATE_FILE=/var/lib/sentry-clone/state.json
      - SENTRY_CLONE_ENABLE_ADMIN_API=1
      - SENTRY_CLONE_ADMIN_TOKEN=test-admin-token-acme-eval
      - SENTRY_AUTH_TOKEN=test-token-acme-eval
      - SENTRY_ORG=acme
    volumes:
      - ./fixture.json:/data/sentry-clone/state.json:ro
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost/api/healthz', timeout=1).read()\""]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
