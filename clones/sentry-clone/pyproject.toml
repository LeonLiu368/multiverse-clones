[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-clone"
version = "0.1.0"
description = "Local Sentry-compatible error monitoring service for agent benchmarks."
requires-python = ">=3.10"
authors = [{name = "Abundant"}]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mcp>=1.2"]

[project.scripts]
sentry = "sentry_clone.cli.sentry:main"
sentry-mcp = "sentry_clone.cli.mcp_server:main"
sentry-clonectl = "sentry_clone.cli.sentry_clonectl:main"

[tool.setuptools.packages.find]
include = ["sentry_clone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
