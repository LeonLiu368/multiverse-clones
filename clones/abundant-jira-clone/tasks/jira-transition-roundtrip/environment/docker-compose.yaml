# Two-container task: a thin agent (`main`) + the EMPTY Jira gateway sidecar with the WEB project
# MOUNTED in. The agent transitions an issue and adds a comment over HTTP; the verifier reads the
# mutation back through the same tool (a write→read round-trip, R5.2).
#   main — the agent (Harbor force-builds it from environment/Dockerfile). Tools + codebase only,
#          no service, no state.json. Reaches the project ONLY over HTTP at http://jira:8765.
#   jira — the gateway sidecar (jira-gateway:empty) with ./data/state.json mounted, serving the
#          planted WEB project. WORLD_ISSUES_ACTOR is a real WEB user so `comment add` (which the
#          gateway stamps with its actor) resolves.
# Requires `custom_docker_compose = true`. NO `networks:` block.
services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APEX_TASK_DOCKER_CLIENT_IMAGE_NAME:-jira-transition-roundtrip-main:local}
    platform: linux/amd64
    environment:
      WORLD_ISSUES_BACKEND: remote
      WORLD_ISSUES_AGENT_MODE: "1"
      WORLD_ISSUES_OUTPUT: json
      WORLD_ISSUES_ACTOR: agent
      WORLD_ISSUES_DEFAULT_PROJECT: WEB
      PLANE_BASE_URL: http://jira:8765
    depends_on:
      jira:
        condition: service_healthy

  jira:
    image: ghcr.io/abundant-ai/jira-gateway-mv:empty   # PULLED (no build); -mv = multiverse-clones build
    hostname: jira
    platform: linux/amd64
    environment:
      WORLD_ISSUES_STATE_FILE: /var/lib/ticketvector/state.json
      WORLD_ISSUES_BIND_HOST: 0.0.0.0
      WORLD_ISSUES_PORT: "8765"
      # The gateway stamps comment authorship from its actor; use a real WEB user so comment add works.
      WORLD_ISSUES_ACTOR: priya.singh
    volumes:
      - ./data/state.json:/var/lib/ticketvector/state.json:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8765/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
