[project]
name = "gwsclone"
version = "0.1.0"
description = "A Google Workspace-faithful service clone (Drive + Docs) for Harbor/Oddish environments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
takeout = ["pypdf>=4.0"]  # PDF text extraction for `seed import-takeout`
dev = ["pytest>=8.0", "mcp>=1.0", "pypdf>=4.0"]

[project.scripts]
gws-cli = "gwsclone.cli.main:app"
gws-mcp = "gwsclone.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwsclone"]

[tool.pytest.ini_options]
pythonpath = ["src"]
