schema_version = "1.2"
name = "gworkspace/gws-create-event"
description = "WRITE→READ round-trip on the Google Workspace clone. A meeting was confirmed in a Gmail thread but is not on the calendar yet; the agent must read the thread (disambiguating a superseded DRAFT decoy at Oct 3 10:00 from Priya's confirmed 'Q3 Retro' on 2026-10-06 14:00-15:00 UTC) and CREATE the event via `gws-cli calendar create` / the `gws_create_event` MCP tool. The verifier reads the calendar back through the API (events.list q='Q3 Retro') and checks the event exists at the confirmed time and NOT the draft date. nop=0 (no write), oracle=1."

[metadata]
category = "tool-use"
failure_mode = "write-not-performed"
tags = ["gworkspace", "google-calendar", "gmail", "gws-clone", "write", "round-trip"]

[agent]
timeout_sec = 1200

[verifier]
timeout_sec = 180

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = true
workdir = "/app"
build_timeout_sec = 2400

[[environment.mcp_servers]]
name = "gws"
transport = "stdio"
command = "gws-mcp"
