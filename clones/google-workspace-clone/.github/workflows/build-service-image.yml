name: Build gworkspace Clone Service Images

# Publishes the gateway image trio MULTI-ARCH (linux/amd64,linux/arm64) on push-to-main
# using the built-in GITHUB_TOKEN (Clone Standard R2.j/R2.k, automating the manual
# docker/build-prod-v1.sh --push):
#   gworkspace-service          base API (latest / sha-<sha>)
#   gworkspace-service:empty     base API, no data — per-task fixture mounted at run time
#   gworkspace-service:prod-v1   corpus DB baked in — boots healthy with NO mount
#   gworkspace-agent             thin agent (gws-cli + gws-mcp only, no api/ or seed/)
on:
  push:
    branches: [main]
    paths: ["clones/google-workspace-clone/**"]
  pull_request:
    paths: ["clones/google-workspace-clone/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: clones/google-workspace-clone

env:
  SERVICE: ghcr.io/abundant-ai/gworkspace-service
  AGENT: ghcr.io/abundant-ai/gworkspace-agent

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run the full surface suite (api/cli/mcp/parity/isolation)
        run: python -m pytest tests -q

  images:
    name: Build + push image trio (multi-arch)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install (for corpus generation)
        run: python -m pip install -e ".[dev]"

      - name: Regenerate deterministic prod corpus -> docker/gws_corpus.db
        run: python -m gwsclone.cli.main seed gen-corpus --out docker/gws_corpus.db

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Metadata (base service)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.SERVICE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Google Workspace Clone Service
            org.opencontainers.image.description=Drive v3 + Docs v1 + Calendar v3 + Gmail v1 clone for agent benchmarks

      # base gateway image (also serves as :empty's parent + the agent's source layer)
      - name: Build + push base service (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: clones/google-workspace-clone
          file: clones/google-workspace-clone/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # :empty — same bits as base; the documented mount-target tag
      - name: Build + push :empty (mount target, multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: clones/google-workspace-clone
          file: clones/google-workspace-clone/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.SERVICE }}:empty
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # :prod-v1 — FROM :empty with the corpus DB baked in; boots healthy with NO mount
      - name: Build + push :prod-v1 (baked corpus, multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: clones/google-workspace-clone/docker
          file: clones/google-workspace-clone/docker/Dockerfile.prod-v1
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE=${{ env.SERVICE }}:empty
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.SERVICE }}:prod-v1
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # thin agent — gws-cli + gws-mcp ONLY (no api/ or seed/ source); neutral base
      - name: Build + push agent (thin, leak-sealed, multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: clones/google-workspace-clone
          file: clones/google-workspace-clone/docker/Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.AGENT }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
