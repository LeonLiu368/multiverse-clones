[project]
name = "figmaclone"
version = "0.1.0"
description = "A Figma-faithful service clone for Harbor/Oddish simulation environments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# MCP server is opt-in so the figma-service image stays lean; the agent client
# installs `.[mcp]` to get the figma-mcp stdio server.
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    "mcp>=1.0",
]

[project.scripts]
figma-cli = "figmaclone.cli.main:app"
figma-mcp = "figmaclone.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/figmaclone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
