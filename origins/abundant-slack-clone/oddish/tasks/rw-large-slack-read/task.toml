schema_version = "1.2"
name = "slack-read/rw-large-slack-read"
description = "Real-world Slack read task (large multi-channel export). The agent navigates a sizeable real Slack workspace through the `slack` CLI / MCP and reports a few simple per-channel facts. Pure tool-use; no codebase. nop=0, oracle=1."

[metadata]
category = "tool-use"
service = "slack"
tools = ["slack-cli", "slack-mcp"]
tags = ["slack", "read", "tool-use", "real-data", "simple"]

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 300

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 8192
allow_internet = true
workdir = "/workspace"
build_timeout_sec = 1800

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "slack-mcp"
