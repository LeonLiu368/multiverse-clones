[project]
name = "slackcli"
version = "0.2.0"
description = "Agent Slack CLI (`slack`) — a thin client of the Slack Web API gateway"
requires-python = ">=3.10"
dependencies = [
    "slack_sdk>=3.27",
]

[project.scripts]
slack = "slackcli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slackcli"]
