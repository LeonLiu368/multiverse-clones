[project]
name = "spoink"
version = "0.0.1"
description = "Abundant snapshot engine -- daily company-state capture for time-travel task harvesting."
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=7"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29", "python-dotenv>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["spoink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
