[project]
name = "slackclone"
version = "0.1.0"
description = "A Slack-faithful service clone for Harbor/Oddish simulation environments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
slack-cli = "slackclone.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slackclone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
