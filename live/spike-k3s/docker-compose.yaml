# k3s self-contained spike: k3s server in ONE privileged container (embedded containerd,
# NO host docker.sock mount) — the failure-mode fix for Harbor DinD-compose on Daytona.
# Proves: cluster boots, a sibling reaches a NodePort service, kubectl set env triggers rollout.
services:
  k3s:
    image: rancher/k3s:v1.31.5-k3s1
    command: server --disable traefik --disable metrics-server --snapshotter native --tls-san k3s
    hostname: k3s
    privileged: true
    tmpfs:
      - /run
      - /var/run
    environment:
      K3S_TOKEN: spiketoken
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "666"
    volumes:
      - ./output:/output
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw=/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  sibling:
    image: rancher/k3s:v1.31.5-k3s1
    entrypoint: ["sh","-c","sleep infinity"]
    volumes:
      - ./output:/output
