# Postgres — the SUT database. In-cluster Service `postgres:5432` (namespace
# conduit). Public image postgres:16 — k3s pulls it at runtime (Oddish) or reuses
# it from containerd if already imported (local).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: conduit
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16
          imagePullPolicy: IfNotPresent   # public; local containerd reuse or Oddish runtime pull
          env:
            - { name: POSTGRES_USER, value: conduit }
            - { name: POSTGRES_PASSWORD, value: conduit }
            - { name: POSTGRES_DB, value: conduit }
            # keep PGDATA on the container's writable layer (no PVC needed for an eval)
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "conduit"]
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: conduit
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
