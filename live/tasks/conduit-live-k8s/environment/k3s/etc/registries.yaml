# k3s containerd registry config. docker.io pulls go through Google's public
# Docker Hub mirror first (no anonymous rate limits) and fall back to docker.io
# itself. Daytona sandboxes share egress IPs, so Docker Hub's 100-pulls/6h
# anonymous quota is a real failure mode (ImagePullBackOff on postgres/otel).
mirrors:
  docker.io:
    endpoint:
      - "https://mirror.gcr.io"
