# Single-container task compose. The `main` service contains both the Mattermost backend +
# Slack gateway AND the agent tools — simpler than the two-container setup (no api sidecar).
# Harbor force-builds `main` from environment/Dockerfile (FROM slack-service + slackcli + codebase).
#
# NO `networks:` block (Harbor injects network_mode, which conflicts). platform pinned amd64.
# The healthcheck gates agent start: harbor/oddish waits for `main` healthy before running the agent.
services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APEX_TASK_DOCKER_CLIENT_IMAGE_NAME:-__TASK__-main:local}
    platform: linux/amd64
    volumes:
      - ./data/mattermost:/data/mattermost:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/api/auth.test >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
