# Two-container isolation. The agent runs in `main`; the backend (Mattermost + the Slack Web
# API gateway) runs in the `api` sidecar. The agent reaches ONLY the gateway, by IP it resolves
# at runtime — no service name, no :8065, no /api/v4, no Mattermost headers are visible.
#
# NO `networks:` block on purpose: the Harbor/Oddish runtime injects `network_mode` on the agent
# service, which is mutually exclusive with an explicit `networks:` key (a known Modal failure).
# We get IP-only addressing without it: Mattermost is bound to 127.0.0.1 inside `api`, and the
# agent discovers the sidecar's IP via DNS at start. Both services pin linux/amd64 (MM is amd64).
services:
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    image: ${APEX_TASK_DOCKER_FORGE_IMAGE_NAME:-slack-api:local}
    platform: linux/amd64
    volumes:
      - shared:/shared
      - ./data/mattermost:/data/mattermost:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/api/auth.test >/dev/null && curl -sf http://localhost:8065/api/v4/system/ping >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 45s

  main:
    build: { context: ., dockerfile: Dockerfile.main }
    image: ${APEX_TASK_DOCKER_CLIENT_IMAGE_NAME:-slack-main:local}
    platform: linux/amd64
    depends_on:
      api:
        condition: service_healthy
    # Token delivered at the standard secrets path (not a tell-y mount name).
    volumes:
      - shared:/run/secrets:ro

volumes:
  shared:
