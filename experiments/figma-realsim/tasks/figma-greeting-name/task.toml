schema_version = "1.2"
name = "figma-realsim/figma-greeting-name"
description = "Simple real2sim smoke task. The figma service is seeded with a REAL Figma file (imported from figma.com via the REST API). A greeting text layer in the design reads 'Hello World! My name is Jaquavious'. The agent must use the figma tool (figma-cli/figma-mcp) to read the design file and implement greeting_name() to return the name the greeting introduces. The name exists only in the design, not in the repo. A hidden grader pins the name. nop=0, oracle=1."

[metadata]
category = "observability"
failure_mode = "info-in-design-only"
tags = ["figma", "figma-clone", "real2sim", "observability", "smoke"]

[agent]
timeout_sec = 1200

[verifier]
timeout_sec = 180

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = true
workdir = "/app"
build_timeout_sec = 2400

[[environment.mcp_servers]]
name = "figma"
transport = "stdio"
command = "figma-mcp"
