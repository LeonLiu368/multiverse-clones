metadata:
  name: paperless-clones
  enable_image_push: true
  oddish_only: true
  description: |
    The 6 APEX-SWE paperless-ngx Observability tasks on the per-repo apex-paperless corpora, seeded
    DIRECTLY: jira-gateway:apex-paperless (shared 2262-issue tracker) + slack-gateway:apex-paperless
    (shared 11.4k-msg community chat) baked + reused across all 6. A gauge per-task incident overlay
    (observability logs merged at boot) merged onto the baked gauge baseline. Agent fixes /app/repo. 
  task_path: experiments/paperless-clones/tasks
  n_trials: 1
  skip_trajectory_analysis: false
tasks:
  - paperless-ngx-10195-10196
  - paperless-ngx-10555
  - paperless-ngx-5228-10559
  - paperless-ngx-6341-9305
  - paperless-ngx-8910-8912
  - paperless-ngx-9784
agents:
  - name: nop
  - name: oracle
  - name: claude-code
    model_name: anthropic/claude-opus-4-8
    n_trials: 3
  - name: codex
    model_name: openai/gpt-5.5
    n_trials: 3
  - name: gemini-cli
    model_name: gemini/gemini-3.1-pro-preview
    n_trials: 3
