schema_version = "1.2"
name = "paperless-clones/paperless-ngx-8910-8912"
description = "PROOF OF CONCEPT: APEX paperless-ngx #10555 (webhook SSRF hardening) on the per-repo apex-paperless corpora, SEEDED DIRECTLY. jira/slack/gauge sidecars are baked :apex-paperless images (shared paperless tracker + community chat + a baked log baseline); the per-task incident logs mount as a gauge overlay merged at boot. Agent investigates via linear/jira + slack + gcx, fixes /app/repo; graded by the upstream pytest. No apex-seed container. nop=0, oracle=1."

[metadata]
category = "observability"
source_repo = "paperless-ngx/paperless-ngx"
apex_task = "Observability/paperless-ngx-paperless-ngx-10555-observability"
apex_origin = "mercor/APEX-SWE (exact task, re-platformed onto abundant clones)"
failure_mode = "rest-api-validation"
tags = ["apex-swe", "observability", "clones", "multi-service", "sre", "ticketvector", "slack", "gauge", "python", "django"]

[agent]
timeout_sec = 2700

[verifier]
timeout_sec = 1800

[environment]
allow_internet = true
build_timeout_sec = 3000
cpus = 4
memory_mb = 8192
storage_mb = 40960
gpus = 0
workdir = "/app/repo"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "slack-mcp"

[[environment.mcp_servers]]
name = "grafana"
transport = "stdio"
command = "mcp-grafana"
