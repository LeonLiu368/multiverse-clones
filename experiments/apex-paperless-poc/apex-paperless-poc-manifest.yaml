metadata:
  name: apex-paperless-poc
  enable_image_push: true
  description: |
    Proof of concept for the per-repo "apex-paperless" corpus model, seeded DIRECTLY (no apex-seed
    converter at standup). The APEX paperless-ngx #10555 task (webhook SSRF) runs against three baked
    :apex-paperless sidecars — jira-gateway (2262-issue tracker), slack-gateway (11.4k-msg community
    chat), gauge-gateway (baked log baseline) — with only the per-task gauge incident overlay mounted
    and merged at boot. The shared corpora are reused across all paperless tasks; only the incident +
    repo + tests are per-task. Graded by the upstream PR's pytest. nop=0, oracle=1.
  task_path: experiments/apex-paperless-poc/tasks
  n_trials: 1
  skip_trajectory_analysis: false
tasks:
  - paperless-ngx-10555
agents:
  - name: nop
  - name: oracle
  - name: gemini-cli
    model_name: gemini/gemini-3.1-pro-preview
  - name: claude-code
    model_name: anthropic/claude-opus-4-7
