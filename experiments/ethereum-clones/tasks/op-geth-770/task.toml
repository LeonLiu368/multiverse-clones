schema_version = "1.3"
artifacts = ["/app/repo", "/var/lib/ticketvector/state.json"]
source = ""

[task]
name = "apex-swe-new-observability/variant-ethereum-optimism-op-geth-770-observability"
description = "APEX-SWE-style multi-service DevOps incident: discover the production issue via the local ticketvector (linear/jira) tracker, fix the root cause in /app/repo, and close the ticket with evidence. Hidden code + ticket-state verification."

[metadata]
author_name = "Abundant AI"
author_email = "tasks@abundant.ai"
author_organization = "Abundant"
difficulty_explanation = "Requires exempting OP genesis blocks from extraData validation without weakening checks for other blocks. Source and hidden tests are real OSS data; ticket context is generated."
solution_explanation = "The fix skips the check for OP genesis and records investigation, commit, and review evidence on the ticket."
verification_explanation = "The verifier injects the PR's hidden regression test, runs the project test command, and checks the ticketvector state for primary-ticket completion evidence (In Review via tracker, assignee, investigation comment, commit link, PR receipt) plus unchanged distractor tickets."
category = "blockchain-core"
tags = ["go", "op-geth", "ethereum", "consensus", "ticketvector"]
expert_time_estimate_hours = 2.0
relevant_experience = "Go, Ethereum consensus, regression testing"

[agent]
timeout_sec = 2700
user = "agent"

[verifier]
timeout_sec = 2700
user = "root"
environment_mode = "separate"

[environment]
allow_internet = true
build_timeout_sec = 1800
cpus = 4
memory_mb = 8192
storage_mb = 40960
gpus = 0
