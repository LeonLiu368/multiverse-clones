schema_version = "1.3"

artifacts = [
  "/app/release_handoff.json",
]

[metadata]
category = "data_analysis"
tags = ["resourcefulness", "release-engineering", "data-mining", "tool-use", "deterministic"]
expert_time_estimate_hours = 0.45
difficulty_explanation = """
This is a release-engineering triage task. The domain skill is deciding which open PRs, issues, and rollout gates actually stop a train by reading check state, owner review state, dependency links, waivers, and release-manager decisions.

Difficulty comes from stale labels and same-domain decoys: the shallow list includes plausible release-looking work that is waived, monitored, or not blocking. A correct handoff needs targeted follow-up through `releasectl`, owner-ready evidence, and dependency-safe ordering.
"""
solution_explanation = """
Use `releasectl --help`, `releasectl docs`, and `releasectl schema` to discover the available operations and submission shape. The list view is intentionally shallow, so inspect release-blocker and train-watch candidates with `releasectl get`, check the train's rollout gates, prune waived or nonblocking decoys through `releasectl decisions`, then pull checks, reviews, and dependency links for the plausible blockers. The expected blocker set is ISSUE-204, PR-411, PR-518, PR-233, ISSUE-119, PR-377, and ISSUE-451, with ISSUE-204 before PR-411/PR-518 and PR-233 before PR-377 before ISSUE-451 in the unblock order. Submit the handoff JSON through `releasectl submit`.
"""
verification_explanation = """
The verifier checks the submitted handoff, the trusted `releasectl` activity log, and the runtime permission boundary. Scoring rewards the correct blocker set, dependency-respecting unblock order, owner-ready evidence, a substantive handoff note, and discovery of the schema, item details, check results, review blockers, dependency links, release-manager decisions, and rollout gates through the operations interface before submitting the final handoff. The rollout-gate check is required because gate-only items are not returned by the normal triage list, and the checks/reviews/links/decisions lookups are required because those evidence fields are not present in the shallow item record. Missing blockers, extra non-blockers, dependency-order mistakes, missing gate or decision lookup, missing evidence-surface lookups for submitted blockers, uninspected submitted blockers, or bypassing `releasectl submit` cap the score.
"""

[verifier]
timeout_sec = 300.0

[agent]
user = "agent"
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1800.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
gpus = 0
allow_internet = true

[verifier.env]

[solution.env]
