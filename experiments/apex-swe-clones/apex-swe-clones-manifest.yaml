metadata:
  name: apex-swe-clones
  description: |
    The exact mercor/APEX-SWE Observability tasks re-platformed onto abundant-ai's
    service clones. Each task's upstream repo snapshot + fixtures are fetched from the
    public APEX-SWE dataset at build; the agent discovers a production incident across
    three lightweight, deterministic clone services — ticketvector (issue tracker),
    slack-service (team chat), and gauge (Grafana/Loki/Prometheus observability) — then
    fixes the root cause in /app/repo. The upstream PR's own test suite is the hidden
    F2P/P2P verifier (clone-independent grading). This collapses APEX's six-container
    Plane+Postgres+Redis+Loki+Grafana+Mattermost stack into three published images. See
    README.md for the recipe and tools/apex_to_clones.py for the converter.
  task_path: experiments/apex-swe-clones/tasks
  n_trials: 1
  skip_trajectory_analysis: false

tasks:
  - paperless-ngx-10195-10196

agents:
  - name: oracle
  - name: nop
  - name: gemini-cli
    model_name: gemini/gemini-3.1-pro-preview
