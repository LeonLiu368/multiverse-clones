schema_version = "1.2"
name = "apex-swe-clones/paperless-ngx-10195-10196"
description = "Exact APEX-SWE Observability task (paperless-ngx #10195/#10196) re-platformed onto the clone stack. Several paperless REST API endpoints return raw HTML 500s instead of JSON when used per their OpenAPI schema (duplicate POST /api/config/, non-dict UI settings, missing optional params). The agent investigates a realistic incident world — a ticketvector tracker (full issue history), a slack/Matrix community chat, and gauge (Django request logs) — and fixes request validation in /app/repo. Graded by the upstream PR's own pytest suite (F2P+P2P). nop=0, oracle=1."

[metadata]
category = "observability"
source_repo = "paperless-ngx/paperless-ngx"
apex_task = "Observability/paperless-ngx-paperless-ngx-10195-10196-observability"
apex_origin = "mercor/APEX-SWE (exact task, re-platformed onto abundant clones)"
failure_mode = "rest-api-validation"
tags = ["apex-swe", "observability", "clones", "multi-service", "sre", "ticketvector", "slack", "gauge", "python", "django"]

[agent]
timeout_sec = 2700

[verifier]
timeout_sec = 1800

[environment]
allow_internet = true
build_timeout_sec = 3000
cpus = 4
memory_mb = 8192
storage_mb = 40960
gpus = 0
workdir = "/app/repo"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "slack-mcp"

[[environment.mcp_servers]]
name = "grafana"
transport = "stdio"
command = "mcp-grafana"
