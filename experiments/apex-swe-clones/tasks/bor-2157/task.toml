schema_version = "1.2"
name = "apex-swe-clones/bor-2157"
description = "Multi-service observability incident on a clone stack. In 0xPolygon/bor, the witness request path leaks goroutines and channels on peer disconnect/cancel, so goroutine count and memory grow unbounded during witness sync. The agent diagnoses across a ticketvector issue, a slack on-call thread, and gauge logs, then fixes the cancel/close paths in /app/repo. Graded by the PR's own Go regression tests. nop=0, oracle=1."

[metadata]
category = "observability"
source_repo = "0xPolygon/bor"
source_pr_url = "https://github.com/0xPolygon/bor/pull/2157"
base_commit = "2a0bfe7f3db8333ca27e9269f27b0e86b49a3913"
failure_mode = "goroutine-leak"
apex_origin = "Observability/0xpolygon-bor (re-platformed onto abundant clones)"
tags = ["apex-swe", "observability", "clones", "multi-service", "sre", "ticketvector", "slack", "gauge", "go", "goroutine-leak"]

[agent]
timeout_sec = 2700

[verifier]
timeout_sec = 1200

[environment]
allow_internet = true
build_timeout_sec = 2400
cpus = 4
memory_mb = 8192
storage_mb = 40960
gpus = 0
workdir = "/app/repo"

# Team chat (Slack/Mattermost stand-in) and observability (Grafana/Loki stand-in) are
# exposed as MCP servers. The issue tracker is the linear/jira CLI (no MCP server).
[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "slack-mcp"

[[environment.mcp_servers]]
name = "grafana"
transport = "stdio"
command = "mcp-grafana"
