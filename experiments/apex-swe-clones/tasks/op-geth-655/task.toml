schema_version = "1.2"
name = "apex-swe-clones/op-geth-655"
description = "Exact APEX-SWE Observability task (ethereum-optimism/op-geth #655) re-platformed onto the clone stack. The Jovian fork needs Data-Availability (DA) footprint tracking + enforcement in block mining: total block gas must include DA overhead (DA size * scalar), txs over the DA limit excluded, deposits excluded, earlier forks unchanged. The agent investigates via a ticketvector tracker, a slack/Discord chat, and gauge logs, then fixes miner/worker + params in /app/repo (optimism op-geth). Graded by the upstream PR's own Go tests in ./miner (41 F2P). nop=0, oracle=1."

[metadata]
category = "observability"
source_repo = "ethereum-optimism/op-geth"
apex_task = "Observability/ethereum-optimism-op-geth-655-observability"
apex_origin = "mercor/APEX-SWE (exact task, re-platformed onto abundant clones)"
failure_mode = "da-footprint-mining"
tags = ["apex-swe", "observability", "clones", "multi-service", "sre", "ticketvector", "slack", "gauge", "go", "blockchain"]

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 2400
user = "root"

[environment]
allow_internet = true
build_timeout_sec = 3000
cpus = 4
memory_mb = 8192
storage_mb = 51200
gpus = 0
workdir = "/app/repo"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "slack-mcp"

[[environment.mcp_servers]]
name = "grafana"
transport = "stdio"
command = "mcp-grafana"
