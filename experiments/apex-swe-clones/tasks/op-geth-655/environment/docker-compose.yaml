services:
  main:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: ${MAIN_IMAGE_NAME}
    entrypoint: ["/bin/bash", "-lc"]
    command: ["sleep infinity"]
    working_dir: /app/repo
    environment:
      WORLD_ISSUES_BACKEND: remote
      WORLD_ISSUES_OUTPUT: json
      WORLD_ISSUES_AGENT_MODE: "1"
      WORLD_ISSUES_ACTOR: agent
      WORLD_ISSUES_DEFAULT_PROJECT: PNGX
      PLANE_BASE_URL: http://127.0.0.1:8765
      SLACK_API_URL: http://slack
      SLACK_BOT_TOKEN: test-token-meridian-eval
      GRAFANA_URL: http://gauge
      GRAFANA_TOKEN: test-token-meridian-eval
      GRAFANA_SERVICE_ACCOUNT_TOKEN: test-token-meridian-eval
    depends_on:
      slack:
        condition: service_healthy
      gauge:
        condition: service_healthy

  # Seed-init: fetch this task's APEX fixtures from HF + convert -> clone seed volumes.
  apex-seed:
    build:
      context: ./seed
      dockerfile: Dockerfile
    environment:
      APEX_TASK: Observability/ethereum-optimism-op-geth-655-observability
      APEX_SERVICE: op-geth
      APEX_KEY: OPGETH
      APEX_WORKSPACE: meridian
    volumes:
      - tvseed:/out/ticketvector
      - slackseed:/out/slack
      - gaugeseed:/out/gauge
    restart: "no"

  ticketvector:
    image: ghcr.io/abundant-ai/ticketvector-service:main
    platform: linux/amd64
    network_mode: service:main
    depends_on:
      main:
        condition: service_started
      apex-seed:
        condition: service_completed_successfully
    environment:
      WORLD_ISSUES_STATE_FILE: /var/lib/ticketvector/state.json
      WORLD_ISSUES_BIND_HOST: 0.0.0.0
      WORLD_ISSUES_PORT: "8765"
      WORLD_ISSUES_ACTOR: agent
    volumes:
      - tvseed:/var/lib/ticketvector

  slack:
    image: ghcr.io/abundant-ai/slack-service:latest
    platform: linux/amd64
    depends_on:
      apex-seed:
        condition: service_completed_successfully
    environment:
      SLACK_BOT_TOKEN: test-token-meridian-eval
    volumes:
      - slackseed:/data/mattermost
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/api/auth.test >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  gauge:
    image: ghcr.io/abundant-ai/gauge-service:main
    hostname: gauge
    platform: linux/amd64
    depends_on:
      apex-seed:
        condition: service_completed_successfully
    environment:
      GAUGE_STATE_FILE: /data/gauge/state.json
      GAUGE_RUNTIME_STATE_FILE: /var/lib/gauge/state.json
      GRAFANA_TOKEN: test-token-meridian-eval
      GRAFANA_SERVICE_ACCOUNT_TOKEN: test-token-meridian-eval
    volumes:
      - gaugeseed:/data/gauge
      - gauge-runtime:/var/lib/gauge
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost/api/healthz', timeout=1).read()\""]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  tvseed:
  slackseed:
  gaugeseed:
  gauge-runtime:
