schema_version = "1.2"
name = "slack-prod-overlay/arrival-time"
description = "Read task on the SHARED prod Slack corpus (88 channels, 2.4M messages) with a tiny per-task overlay merged in at standup. A planted message in the real #engineering channel says a teammate is 'coming in at 6pm' to push the payments hotfix; the agent must find it via the slack CLI/MCP and report the time (18:00). Pure tool-use; no codebase. nop=0, oracle=1."

[metadata]
category = "tool-use"
service = "slack"
tools = ["slack-cli", "slack-mcp"]
tags = ["slack", "read", "tool-use", "prod-overlay", "real-data"]

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 300

[environment]
custom_docker_compose = true
cpus = 2
memory_mb = 4096
storage_mb = 8192
allow_internet = true
workdir = "/workspace"
build_timeout_sec = 1800

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "slack-mcp"
