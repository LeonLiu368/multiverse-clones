# One agent (`main`) + five PULLED clone sidecars. The agent reaches each by name and never
# mounts the seed files, so every fact is reachable only through the clone's tool/API.
#   slack  (prod-v1) — real prod corpus + this task's overlay (#engineering message)
#   jira   (prod-v1) — real ENG corpus + this task's overlay (WEB-100)
#   github           — a seeded open-source-style repo (acme/reporting-export)
#   gauge            — synthetic export-service logs
#   sentry           — a synthetic issue (EXP-501)
# No `networks:` block (Harbor wires networking). platform pinned for the amd64 images.
# prod-v1 sidecars are pinned by digest (tags are cached by the cloud runner).
services:
  main:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: ${MAIN_IMAGE_NAME:-multi-clone-fetch-basics-main:local}
    working_dir: /app
    command: ["sleep", "infinity"]
    environment:
      SLACK_API_URL: http://slack
      SLACK_BOT_TOKEN: xoxp-acme-eval-0001
      PLANE_BASE_URL: http://jira:8765
      PLANE_API_KEY: test-token-acme-eval
      WORLD_ISSUES_BACKEND: remote
      WORLD_ISSUES_AGENT_MODE: "1"
      WORLD_ISSUES_OUTPUT: json
      WORLD_ISSUES_ACTOR: agent
      WORLD_ISSUES_DEFAULT_PROJECT: WEB
      GH_HOST: http://github
      GH_TOKEN_FILE: /run/secrets/token
      GRAFANA_URL: http://gauge
      GRAFANA_TOKEN: test-token-acme-eval
      GRAFANA_SERVICE_ACCOUNT_TOKEN: test-token-acme-eval
      SENTRY_URL: http://sentry
      SENTRY_AUTH_TOKEN: test-token-acme-eval
      SENTRY_ORG: acme
    volumes:
      - ghc-shared:/run/secrets:ro
    depends_on:
      slack:
        condition: service_healthy
      jira:
        condition: service_healthy
      github:
        condition: service_healthy
      gauge:
        condition: service_healthy
      sentry:
        condition: service_healthy

  slack:
    image: ${SLACK_GATEWAY_IMAGE:-ghcr.io/abundant-ai/slack-gateway:prod-v1@sha256:802285ddd636659c7d0bafeb2616931ae0d4493d62e6c02a5e7a165511209c7d}
    hostname: slack
    platform: linux/amd64
    environment:
      SLACK_BOT_TOKEN: xoxp-acme-eval-0001
    volumes:
      - ./data/slack-overlay:/data/slack-overlay:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/api/auth.test >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  jira:
    image: ${JIRA_GATEWAY_IMAGE:-ghcr.io/abundant-ai/jira-gateway:prod-v1@sha256:7701b536418bdeb6485edbfb28cc7ea67300032fb52f3400a7687d985d2ad219}
    hostname: jira
    platform: linux/amd64
    environment:
      WORLD_ISSUES_STATE_FILE: /var/lib/ticketvector/state.json
      WORLD_ISSUES_BIND_HOST: 0.0.0.0
      WORLD_ISSUES_PORT: "8765"
      WORLD_ISSUES_ACTOR: agent
    volumes:
      - ./data/ticketvector/state.json:/data/state-overlay.json:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8765/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  github:
    image: ghcr.io/abundant-ai/ghc-service:latest@sha256:d4e88d7fa4af0ae84213d54f4b884b3a8954ebad9fe88b6f6fb97cea1443b3cf
    hostname: github
    platform: linux/amd64
    volumes:
      - ghc-shared:/shared
      - ./data/github/seed.sh:/usr/local/bin/task-seed.sh:ro
      - ./data/github/app-src:/seed/app-src:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/api/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 45s

  gauge:
    image: ghcr.io/abundant-ai/gauge-service:main
    hostname: gauge
    platform: linux/amd64
    environment:
      GAUGE_STATE_FILE: /data/gauge/state.json
      GAUGE_RUNTIME_STATE_FILE: /var/lib/gauge/state.json
      GRAFANA_TOKEN: test-token-acme-eval
      GRAFANA_SERVICE_ACCOUNT_TOKEN: test-token-acme-eval
    volumes:
      - ./data/gauge/state.json:/data/gauge/state.json:ro
      - gauge-runtime:/var/lib/gauge
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost/api/healthz', timeout=1).read()\""]
      interval: 2s
      timeout: 2s
      retries: 30

  sentry:
    image: ghcr.io/abundant-ai/sentry-clone-service:main
    hostname: sentry
    platform: linux/amd64
    environment:
      SENTRY_CLONE_STATE_FILE: /data/sentry-clone/state.json
      SENTRY_CLONE_RUNTIME_STATE_FILE: /var/lib/sentry-clone/state.json
      SENTRY_AUTH_TOKEN: test-token-acme-eval
      SENTRY_ORG: acme
    volumes:
      - ./data/sentry-clone/state.json:/data/sentry-clone/state.json:ro
      - sentry-runtime:/var/lib/sentry-clone
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost/api/healthz', timeout=1).read()\""]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  ghc-shared:
  gauge-runtime:
  sentry-runtime:
