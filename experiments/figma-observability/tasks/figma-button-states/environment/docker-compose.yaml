# Two containers, both from the SINGLE prebuilt figma-service image (public on GHCR):
#   * `figma`  — the Figma REST API, seeded PER TASK by mounting this task's fixture.json
#                into the service container ONLY (the agent never sees it).
#   * `main`   — the agent box: FROM figma-service (so it has figma-cli + figma-mcp),
#                plus pytest + the task codebase. NO figma source is vendored into the task.
#
# No `networks:` block — services resolve each other by name (the agent reaches the API at
# http://figma:3000). `main` waits on the `figma` healthcheck before the agent starts.
services:
  main:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: ${MAIN_IMAGE_NAME}
    working_dir: /app
    environment:
      FIGMA_API_URL: http://figma:3000
      FIGMA_TOKEN: figma-clone-token
      FIGMA_FILE_KEY: BtnStatesSpecFile0001x
    depends_on:
      figma:
        condition: service_healthy

  figma:
    image: ghcr.io/abundant-ai/figma-service:latest
    hostname: figma
    platform: linux/amd64
    environment:
      FIGMA_FIXTURE: /srv/fixture.json
    volumes:
      - ./data/figma/fixture.json:/srv/fixture.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
