metadata:
  name: gauge-smoke
  enable_image_push: true
  description: |
    Standalone smoke test for the gauge clone's agent/gateway split (NOT an
    APEX task). Two containers: a thin data-free gauge-agent (gcx CLI) as `main`, and a
    gauge-gateway:empty sidecar that mounts a baseline log corpus + an incident overlay and merges
    them at boot. The agent must use `gcx logs query` to find the endpoint returning 500s
    (/api/payments/charge) and write it to /workspace/answer.txt. Log data lives only in the gauge
    sidecar. Deterministic nop=0, oracle=1.
  task_path: experiments/gauge-smoke/tasks
  n_trials: 1
  skip_trajectory_analysis: false

tasks:
  - find-failing-endpoint

agents:
  - name: nop
  - name: oracle
  - name: gemini-cli
    model_name: gemini/gemini-3.1-pro-preview
  - name: claude-code
    model_name: anthropic/claude-opus-4-7
