schema_version = "1.2"
name = "pull-smoke/notion-pull"
description = "Image-pulling-pattern smoke: same read+write Notion task as notion-db-triage, but the task environment vendors NO clone source — the gateway is PULLED (ghcr.io/abundant-ai/notion-service:prod-v1, corpus baked in) and the agent is FROM the published notion-agent (tools only). Proves a task can run with nothing left behind: no notionclone source, no corpus file, no gateway Dockerfile in environment/. The agent queries the Tasks database, marks 'Rotate prod database creds' Done + checked, and comments 'rotated'; the verifier reads it back through the API. nop=0, oracle=1."

[metadata]
category = "software-engineering"
service = "notion"
clone = "notion-clone"
pattern = "image-pull-no-vendored-source"
tools = ["notion-cli", "notion-mcp"]
tags = ["notion", "notion-clone", "image-pull", "pull-pattern", "tool-use", "read-write", "smoke"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 300

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = true
workdir = "/workspace"
build_timeout_sec = 1800

[[environment.mcp_servers]]
name = "notion"
transport = "stdio"
command = "notion-mcp"
