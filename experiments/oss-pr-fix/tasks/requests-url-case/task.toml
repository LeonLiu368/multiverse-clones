schema_version = "1.3"
source = "psf/requests PR #1385 — case-insensitive URL scheme matching"

[task]
name = "oss-pr-fix/requests-url-case"
description = "A deliberately under-specified, multi-surface SWE task. The agent is told only 'there's a task assigned to Sam — go find it and fix it' (no tool list, no repo name, no contract). It must discover its own tooling and work across three seeded services: an issue tracker (Linear/Jira clone), a Slack workspace, and a self-hosted GitHub forge (Forgejo). The real bug: meridian/webapp vendors a small stand-in for the requests library that matches URL schemes case-sensitively, so uppercase-scheme URLs (HTTP://, HTTPS://) raise 'No connection adapters were found' and bypass cert verification (mirrors psf/requests PR #1385). The agreed fix — apply .lower() at the scheme comparison in BOTH Session.get_adapter (sessions.py) and HTTPAdapter.cert_verify (adapters.py) — is never stated in one place: Linear ticket WEB-101 gives the symptom and (only in its latest comment) the repo; the exact two-site contract is split across #eng and #web-platform in Slack; an older thread baits a wrong approach (casefold / lowercasing the whole URL). The agent must pick the right ticket among same-priority decoys (one lures a one-site fix), extract the contract, clone the correct repo (two decoy repos hold plausible wrong code), implement the fix, and open a PR against main. Graded by checking out the PR head and running existing tests (P2P) plus hidden mixed-case tests (F2P). nop=0, oracle=1."
custom_docker_compose = true

[metadata]
author_name = ""
author_email = ""
author_organization = ""
category = "swe"
source_repo = "meridian/webapp"
difficulty_explanation = "Hard, and the difficulty is dominated by navigation, not coding (the fix is two one-line edits). The one-line instruction names no tools, repo, or deliverable, so the agent must self-discover the tracker/Slack/forge. The contract is split across Slack channels (#eng -> #web-platform) with an older bait thread proposing the wrong approach (casefold / lowercasing the whole URL); two same-priority Linear tickets are assigned to Sam (the real WEB-101 and a decoy that lures a one-site-only fix); two decoy repos hold plausible wrong code; an in-repo CONTRIBUTING.md and a code comment misdirect; and a Slack message plants the contract token in a foreign/negated context. The F2P tests are contract-strict: fixing only one of the two sites, or mutating the adapter prefix map, still fails."
solution_explanation = "1) `linear issue mine` lists Sam's tickets; the real one is WEB-101 (p1, In Progress) — its description gives the symptom and its LATEST comment names the repo (meridian/webapp) and points to team chat (an earlier comment baits casefold — ignore it; WEB-108 is a decoy that lures fixing get_adapter only). 2) In Slack, read #eng past the stale ~3-week-old thread to the current decision, which points to #web-platform for the exact two-site contract. 3) Clone meridian/webapp (NOT the edge-proxy / dns-resolver decoys). 4) In requests/sessions.py change `url.startswith(prefix)` -> `url.lower().startswith(prefix.lower())` in Session.get_adapter, AND in requests/adapters.py change `url.startswith('https')` -> `url.lower().startswith('https')` in HTTPAdapter.cert_verify. 5) Open a PR against main. solution/solve.sh performs exactly these edits."
verification_explanation = "tests/test.sh: the verifier finds the agent's open PR on meridian/webapp via the Forgejo pulls REST API, checks out the PR head, then OVERWRITES tests/ with its own authoritative test_basic.py (P2P) and test_bug.py (F2P) so the agent cannot win by editing tests. It runs P2P then F2P under unittest; reward=1 only if BOTH pass, else 0. F2P checks uppercase/mixed-case adapter selection AND cert_verify (so a one-site fix fails) plus that the stored adapter prefixes stay lowercase. If no open PR exists but a merge to main is detected, it grades main. nop opens no PR -> 0; oracle applies the fix and opens a PR -> 1."
tags = ["gh", "linear", "slack", "multi-surface", "pr", "unit-tests", "python", "requests", "oss"]
expert_time_estimate_hours = 0.4
relevant_experience = "Reading issue trackers and chat for requirements, Python library internals, GitHub PR workflow, writing code to pass a test suite"

[agent]
timeout_sec = 1800
user = "agent"

[verifier]
timeout_sec = 300
user = "root"

[environment]
allow_internet = true
build_timeout_sec = 2400
cpus = 2
memory_mb = 4096
storage_mb = 20480
gpus = 0
workdir = "/app"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "slack-mcp"
