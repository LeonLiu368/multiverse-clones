# Oddish sweep config — controls (oracle, nop) + a 2-trial gemini run.
#
# Run:  oddish run -c experiments/figma-linear/sweep.yaml
#
# NOTE: the current oddish `load_sweep_config` requires `model_name` on EVERY agent
# entry, including `oracle` and `nop` (older sweep files that omit it now fail with
# "Agent entry N missing 'model_name' field"). The oracle/nop agents do not call a
# model, so the value is ignored by them at runtime — it only satisfies the schema.
path: ./experiments/figma-linear/tasks/figma-linear-handoff

agents:
  - name: oracle
    model_name: google/gemini-3.1-pro-preview
    n_trials: 1
  - name: nop
    model_name: google/gemini-3.1-pro-preview
    n_trials: 1
  - name: gemini-cli
    model_name: google/gemini-3.1-pro-preview
    n_trials: 2
