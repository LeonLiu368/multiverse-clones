schema_version = "1.3"
source = "psf/requests PR #5810 — reject NaN/Infinity in JSON serialization"

[task]
name = "oss-pr-fix/requests-json-nan"
description = "A deliberately under-specified, multi-surface SWE task. The agent is told only 'there's a task assigned to Sam — go find it and fix it' (no tool list, no repo name, no contract). It must discover its own tooling and work across three seeded services: an issue tracker (Linear/Jira clone), a Slack workspace, and a self-hosted GitHub forge (Forgejo). The real bug: meridian/api-service vendors a small stand-in for the requests library whose PreparedRequest.prepare_body serializes float('nan')/float('inf') into JSON bodies, which the upstream gateway rejects with 400 (mirrors psf/requests PR #5810). The agreed fix — add InvalidJSONError(RequestException) in requests/exceptions.py and pass allow_nan=False to json.dumps in prepare_body, re-raising the ValueError as InvalidJSONError(ve, request=self) — is never stated in one place: Linear ticket API-202 gives the symptom and (only in its latest comment) the repo; the exact contract is split across #eng and #api-team in Slack; an older Linear/Slack thread baits a wrong approach (JSONDecodeError). The agent must pick the right ticket among same-priority decoys, extract the contract, clone the correct repo (two decoy repos hold plausible wrong code), implement the fix, and open a PR against main. Graded by checking out the PR head and running existing tests (P2P) plus hidden NaN/Infinity tests (F2P). nop=0, oracle=1."
custom_docker_compose = true

[metadata]
author_name = ""
author_email = ""
author_organization = ""
category = "swe"
source_repo = "meridian/api-service"
difficulty_explanation = "Hard, and the difficulty is dominated by navigation, not coding (the fix is ~5 lines). The one-line instruction names no tools, repo, or deliverable, so the agent must self-discover the tracker/Slack/forge. The contract is split across Slack channels (#eng -> #api-team) with an older bait thread proposing the wrong approach (JSONDecodeError); two same-priority Linear tickets are assigned to Sam (the real API-202 and a decoy that confidently suggests the wrong fix); two decoy repos hold plausible wrong code; an in-repo CONTRIBUTING.md and a code comment misdirect; and a Slack message plants the contract token in a foreign/negated context. The F2P tests are contract-strict: a near-correct fix (substring NaN check, or dropping request=self) still fails."
solution_explanation = "1) `linear issue mine` lists Sam's tickets; the real one is API-202 (p1, In Progress) — its description gives the symptom and its LATEST comment names the repo (meridian/api-service) and points to team chat (an earlier comment baits JSONDecodeError — ignore it). 2) In Slack, read #eng past the stale ~3-week-old thread to the current decision, which points to #api-team for the exact contract. 3) Clone meridian/api-service (NOT the metrics-exporter / gateway-service decoys). 4) Add `class InvalidJSONError(RequestException)` to requests/exceptions.py, import it in requests/models.py, and change prepare_body's json branch to `complexjson.dumps(json, allow_nan=False)` in a try/except that does `raise InvalidJSONError(ve, request=self)`. 5) Open a PR against main. solution/solve.sh performs exactly these edits."
verification_explanation = "tests/test.sh: the verifier finds the agent's open PR on meridian/api-service via the Forgejo pulls REST API, checks out the PR head, then OVERWRITES tests/ with its own authoritative test_basic.py (P2P) and test_bug.py (F2P) so the agent cannot win by editing tests. It runs P2P then F2P under unittest; reward=1 only if BOTH pass, else 0. If no open PR exists but a merge to main is detected, it grades main instead. nop opens no PR -> 0; oracle applies the fix and opens a PR -> 1."
tags = ["gh", "linear", "slack", "multi-surface", "pr", "unit-tests", "python", "requests", "oss", "json"]
expert_time_estimate_hours = 0.4
relevant_experience = "Reading issue trackers and chat for requirements, Python JSON serialization, exception design, GitHub PR workflow, writing code to pass a test suite"

[agent]
timeout_sec = 1800
user = "agent"

[verifier]
timeout_sec = 300
user = "root"

[environment]
allow_internet = true
build_timeout_sec = 2400
cpus = 2
memory_mb = 4096
storage_mb = 20480
gpus = 0
workdir = "/app"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "slack-mcp"
