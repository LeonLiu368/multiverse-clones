# Two-container task: a thin agent (`main`) + the EMPTY Jira gateway sidecar with a per-task
# project MOUNTED in.
#   main — the agent (Harbor force-builds it from environment/Dockerfile). Tools + codebase only,
#          no service, no state.json. Reaches the project ONLY over HTTP at http://jira:8765.
#   jira — the gateway sidecar (PULLED ghcr.io/abundant-ai/jira-gateway:empty): the ticketvector issue service with NO
#          baked data. This task MOUNTS its own ./data/state.json at
#          /var/lib/ticketvector/state.json, so the service serves exactly the planted WEB project.
#          The data is NOT on the agent's filesystem.
#
# This is the EMPTY-gateway + per-task-mount seeding path (vs. the prod-corpus-baked path used by
# jira-status-lookup). Requires `custom_docker_compose = true`. NO `networks:` block.
services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APEX_TASK_DOCKER_CLIENT_IMAGE_NAME:-jira-assignee-count-main:local}
    platform: linux/amd64
    environment:
      WORLD_ISSUES_BACKEND: remote
      WORLD_ISSUES_AGENT_MODE: "1"
      WORLD_ISSUES_OUTPUT: json
      WORLD_ISSUES_ACTOR: agent
      WORLD_ISSUES_DEFAULT_PROJECT: WEB
      PLANE_BASE_URL: http://jira:8765
    depends_on:
      jira:
        condition: service_healthy

  jira:
    image: ${JIRA_GATEWAY_IMAGE:-ghcr.io/abundant-ai/jira-gateway:empty}
    hostname: jira
    platform: linux/amd64
    environment:
      WORLD_ISSUES_STATE_FILE: /var/lib/ticketvector/state.json
      WORLD_ISSUES_BIND_HOST: 0.0.0.0
      WORLD_ISSUES_PORT: "8765"
      WORLD_ISSUES_ACTOR: agent
    volumes:
      - ./data/state.json:/var/lib/ticketvector/state.json:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8765/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
