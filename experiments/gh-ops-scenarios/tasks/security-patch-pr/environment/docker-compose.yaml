# Harbor compose override for security-patch-pr.
# Gates main on the github forge sidecar.
# NO networks: block (Harbor injects network_mode). NO ports:.
services:
  main:
    depends_on:
      github: {condition: service_healthy}
    volumes:
      - ghc-shared:/run/secrets:ro

  # GitHub forge sidecar. On boot: creates admin `acme`, writes token to
  # /shared/token (exposed to main via ghc-shared volume), then runs task-seed.sh.
  # GHC_ROOT_URL defaults to http://github/ matching GH_HOST in main.
  github:
    image: ghcr.io/abundant-ai/ghc-service@sha256:d4e88d7fa4af0ae84213d54f4b884b3a8954ebad9fe88b6f6fb97cea1443b3cf
    platform: "linux/amd64"
    volumes:
      - ghc-shared:/shared
      - ./data/github/seed.sh:/usr/local/bin/task-seed.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/api/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 45s

volumes:
  ghc-shared:
