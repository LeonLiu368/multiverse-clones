# gh-ops-scenarios sweep.
# Submit: uv run oddish run "$TASKS_DIR" -c sweep.yaml --experiment <id> \
#   --env daytona --run-analysis --force-build --artifact /app --github-user <login> --background
#
# Validate controls (oracle=1 / nop=0) before spending model trials.

agents:
  - name: oracle
  - name: nop
  - name: gemini-cli
    model_name: gemini/gemini-3.1-pro-preview
    n_trials: 3
  - name: codex
    model_name: openai/gpt-5.2-codex
    n_trials: 2
  - name: claude-code
    model_name: anthropic/claude-opus-4-7
    n_trials: 2
