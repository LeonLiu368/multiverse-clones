schema_version = "1.2"
name = "three-surface-ops/oncall-fix-and-close"
description = "On-call incident: the /api/search endpoint crashes with a 500 on empty query strings. Ticket PROD-101 names the incident; the #ops-oncall Slack thread has the root-cause diagnosis (term[0] IndexError in search.py) and agreed fix; the GitHub repo has the code. Agent must read all three, fix search.py, ship via reviewed PR, and move the ticket to Done. nop=0, oracle=1."

[metadata]
category = "observability"
source_repo = "acme/webapp"
failure_mode = "unhandled-edge-case"
tags = ["gh", "slack", "ticketvector", "multi-surface", "incident", "three-service"]

[agent]
timeout_sec = 2700

[verifier]
timeout_sec = 300

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 16384
gpus = 0
allow_internet = false
workdir = "/app"
build_timeout_sec = 2400

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "slack-mcp"
