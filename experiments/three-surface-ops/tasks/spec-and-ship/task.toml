schema_version = "1.2"
name = "three-surface-ops/spec-and-ship"
description = "Feature delivery: ticket FEAT-301 requests email validation for the registration endpoint. The #eng-design Slack channel has the team's agreed implementation spec — the exact regex pattern, error code, and which function in register.py to modify. Agent must correlate all three surfaces, implement the validation, ship via reviewed PR, and move the ticket to Done. nop=0, oracle=1."

[metadata]
category = "swe"
source_repo = "acme/platform"
failure_mode = "missing-validation"
tags = ["gh", "slack", "ticketvector", "multi-surface", "feature", "validation", "three-service"]

[agent]
timeout_sec = 2700

[verifier]
timeout_sec = 300

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 16384
gpus = 0
allow_internet = true
workdir = "/app"
build_timeout_sec = 2400

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "slack-mcp"
