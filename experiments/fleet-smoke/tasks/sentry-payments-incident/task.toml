schema_version = "1.2"
name = "sentry-clone/payments-incident"
description = "Read + write incident-triage task on a Sentry-clone workspace. A production incident (issue PAYMENTS-501) is firing on the payments-api project. The agent uses the sentry CLI and the sentry-mcp MCP server (pointed at the `sentry` gateway over HTTP) to read the latest event stacktrace + suspect commit, resolve PAYMENTS-501 in the fix release (payments-api@2026.06.07.2), and post a root-cause comment. A verifier reads the workspace back through the Sentry API: PAYMENTS-501 must be resolved AND carry a new agent comment (write->read round-trip). Incident data lives only in the sentry sidecar. Deterministic nop=0, oracle=1."

[metadata]
category = "software-engineering"
service = "sentry"
clone = "sentry-clone"
tools = ["sentry", "sentry-mcp"]
tags = ["sentry", "sentry-clone", "observability", "incident", "tool-use", "read-write", "round-trip", "agent-gateway-split", "smoke"]
assessment_grade = ["issues.search", "issues.resolve", "comments.create"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 300

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = true
workdir = "/workspace"
build_timeout_sec = 1800

# The agent operates Sentry through the sentry CLI and this MCP server (stdio).
# sentry-mcp is installed in the agent image and reaches the `sentry` gateway via the
# baked SENTRY_URL env — the same HTTP API the CLI uses, so CLI and MCP are in parity.
[[environment.mcp_servers]]
name = "sentry"
transport = "stdio"
command = "sentry-mcp"
