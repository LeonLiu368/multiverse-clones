metadata:
  name: mattermost-tasks
  description: |
    Oddish-runnable multi-service tasks built on the REAL Mattermost product (team
    edition 8.1.1 + embedded Postgres) instead of a from-scratch clone. Each task drops
    the agent into a seeded Mattermost workspace and gives it two interchangeable surfaces:
    `mmctl` (the official Mattermost CLI) and an `mmctl-mcp` MCP server (~65 structured
    tools, registered via task.toml [environment].mcp_servers, stdio, remote-auth over TCP).
    The verifier reads workspace state back via the Mattermost REST API, so scoring is
    deterministic (nop=0, oracle=1).
    Tasks are self-contained: the Mattermost service Dockerfile + seeder + seed data are
    vendored into each task's environment/ so `oddish run` uploads and builds with no
    external references.
  task_path: oddish/tasks
  n_trials: 1
  skip_trajectory_analysis: false

tasks:
  - mattermost-incident-response

agents:
  - name: gemini-cli
    model_name: google/gemini-3.1-pro-preview
  - name: oracle
  - name: nop
