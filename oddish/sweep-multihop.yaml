# oddish run -c oddish/sweep-multihop.yaml
# Multi-hop cross-surface task: Gmail (which launch is authoritative) -> Calendar (its date).
path: ./oddish/tasks/gws-launch-multihop
agents:
  - name: oracle
    model_name: google/gemini-3.1-pro-preview
    n_trials: 1
  - name: nop
    model_name: google/gemini-3.1-pro-preview
    n_trials: 1
  - name: gemini-cli
    model_name: google/gemini-3.1-pro-preview
    n_trials: 2
