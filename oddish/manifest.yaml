metadata:
  name: slack-observability-tasks
  description: |
    APEX-SWE-style observability + software-engineering tasks. The agent is dropped into a
    real (seeded) Slack workspace — operated via the `slack` tool (CLI + MCP) — alongside a
    codebase at /workspace whose pytest suite is failing. The information needed to fix the
    code (an agreed policy, a changed API contract, an incident root cause) lives ONLY in the
    heavy, noisy chat history and is buried among distractors and superseded values, so
    recovering it requires real, non-trivial tool use. A HIDDEN grading test pins the exact
    answer (it is never in the repo or the visible tests), and one task additionally requires
    posting a postmortem back to Slack (action beyond coding). Deterministic: nop=0, oracle=1.
  task_path: oddish/tasks
  n_trials: 1
  skip_trajectory_analysis: false

tasks:
  - buried-spec
  - contract-drift
  - incident-fix-report

agents:
  - name: gemini-cli
    model_name: google/gemini-3.1-pro-preview
  - name: oracle
  - name: nop
