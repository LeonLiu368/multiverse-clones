schema_version = "1.2"
name = "abundant-mattermost/buried-spec"
description = "Observability + SWE task. A billing function is unimplemented and its test suite fails. The exact policy was never written into the repo — it was agreed in a long, noisy workspace discussion (with several superseded proposals). The agent must use the `slack` tool to dig through heavy chat history, recover the FINAL agreed policy, implement it, and make the suite pass. A hidden grading test pins the exact policy, so the answer cannot be read from the visible tests. nop=0, oracle=1."

[metadata]
category = "software-engineering"
service = "slack"
tools = ["slack-web-api", "slack_sdk", "curl"]
tags = ["slack", "observability", "swe", "tool-use", "exploration", "isolated", "tests"]

[agent]
timeout_sec = 2400

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = true
workdir = "/workspace"
build_timeout_sec = 1800
