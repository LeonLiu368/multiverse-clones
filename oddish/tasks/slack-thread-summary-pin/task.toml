schema_version = "1.2"
name = "abundant-slack-clone/slack-thread-summary-pin"
description = "Multi-service Slack-clone task: the agent is told a past decision was never written down and people keep re-asking, and must find the thread, determine the outcome, write it up, and pin it so it's findable. Verified deterministically via the Slack API (nop=0, oracle=1)."

[metadata]
category = "knowledge-work"
service = "slack"
tools = ["slack-cli", "slack-mcp"]
tags = ["slack-clone", "multi-service", "open-ended", "summarize", "threads", "pins"]

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
workdir = "/app"
build_timeout_sec = 1200
