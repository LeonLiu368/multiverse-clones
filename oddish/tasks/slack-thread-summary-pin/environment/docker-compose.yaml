# Merged on top of Harbor's base compose. Harbor auto-configures the `main` (agent)
# container from environment/Dockerfile; here we only OVERRIDE `main` (point it at the
# service + wait for health) and ADD the self-contained `slack` service.
#
# No `networks:` — Harbor wires networking (and injects network_mode on `main` for the
# Modal/DinD provider, which is mutually exclusive with an explicit networks: key).
# The agent reaches the service by name at http://slack:3000.
#
# The `slack` service builds self-contained from THIS environment/ dir (vendored
# package + this task's workspace seed) — no repo-root build context, so it builds
# inside Harbor's sandbox where only the task is uploaded.
services:
  main:
    environment:
      - SLACK_API_URL=http://slack:3000
    depends_on:
      slack:
        condition: service_healthy

  slack:
    build:
      context: .
      dockerfile: slack/Dockerfile
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
