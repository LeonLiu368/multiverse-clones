# Multi-service Oddish task: a seeded Slack workspace (`slack`) + the agent (`client`)
# with slack-cli. Both build from this environment/ dir (context: .) which vendors the
# slackclone package, so the task is self-contained for `oddish run` upload.
services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APEX_TASK_DOCKER_CLIENT_IMAGE_NAME:-slack-incident-triage-client:local}
    container_name: ${APEX_TASK_DOCKER_CLIENT_CONTAINER_NAME:-client}
    environment:
      - SLACK_API_URL=http://slack:3000
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      slack:
        condition: service_healthy
    networks: [sim]

  slack:
    build:
      context: .
      dockerfile: slack/Dockerfile
    image: slack-clone:local
    container_name: slack
    volumes:
      - ./data/slack:/data/slack:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [sim]

networks:
  sim:
    driver: bridge
