schema_version = "1.2"
name = "abundant-slack-clone/slack-incident-triage"
description = "Multi-service Slack-clone task: the agent triages an incident thread in a seeded Slack workspace using slack-cli and posts the root cause. Verified deterministically via the Slack API (nop=0, oracle=1)."

[metadata]
category = "knowledge-work"
service = "slack"
tools = ["slack-cli"]
tags = ["slack-clone", "multi-service", "cli", "incident-triage"]

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
workdir = "/app"
build_timeout_sec = 1200
