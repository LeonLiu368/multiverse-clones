schema_version = "1.2"
name = "abundant-slack-clone/slack-incident-triage"
description = "Multi-service Slack-clone task: the agent gets a vague 'something's wrong in prod' nudge and must investigate the workspace with its Slack tools to find the underlying cause, then post a writeup. Verified deterministically via the Slack API (nop=0, oracle=1)."

[metadata]
category = "knowledge-work"
service = "slack"
tools = ["slack-cli", "slack-mcp"]
tags = ["slack-clone", "multi-service", "open-ended", "incident-triage"]

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
workdir = "/app"
build_timeout_sec = 1200
