schema_version = "1.2"
name = "abundant-mattermost/file-sharing-broken"
description = "Observability/remediation task on a real Mattermost workspace: file attachments have been disabled server-wide, so no one can share files. The agent is told only the symptom and which tools it has; it must explore (mmctl / mmctl-mcp) to find the misconfiguration and fix it. Verified deterministically via the Mattermost REST API (nop=0, oracle=1)."

[metadata]
category = "knowledge-work"
service = "mattermost"
tools = ["mmctl", "mmctl-mcp"]
tags = ["mattermost", "multi-service", "observability", "diagnose-and-fix", "exploration", "mcp"]

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = true
workdir = "/app"
build_timeout_sec = 1800

# MCP server made available to the agent (Harbor MCPServerConfig schema). The agent runtime
# launches this stdio server and auto-discovers its ~60 mmctl-backed tools.
mcp_servers = [
  { name = "mattermost", transport = "stdio", command = "/usr/local/bin/mcp-mmctl", args = [] },
]
