# Multi-service Oddish task: a seeded **real Mattermost** workspace (`mattermost`) + an
# agent container (`client`) whose tool is `mmctl` (the official Mattermost CLI).
#
# Self-contained: both images build from THIS environment/ dir (context: .), which vendors
# the Mattermost service Dockerfile/seeder and the seed data — so `oddish run` uploads and
# builds the task with no references outside the task directory.
#
# NOTE: no `networks:` here. The Harbor/Oddish runtime injects `network_mode` onto the
# `client` service (mutually exclusive with an explicit `networks:` key) and wires
# inter-service networking itself — services still resolve each other by name
# (client -> http://mattermost:8065). Mirrors the canonical APEX shared compose.
services:
  client:
    # Mattermost (and thus mmctl) is published for linux/amd64 only; pin the client to the
    # same arch so the amd64 mmctl binary runs. Oddish/Modal runs amd64 natively; on arm64
    # dev machines this goes through emulation.
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APEX_TASK_DOCKER_CLIENT_IMAGE_NAME:-incident-fix-report-client:local}
    container_name: ${APEX_TASK_DOCKER_CLIENT_CONTAINER_NAME:-client}
    environment:
      - MM_URL=http://mattermost:8065
      - MM_TEAM=test-demo
      - MM_ADMIN_USER=admin@demo.local
      - MM_ADMIN_PASS=AdminUser123!
    depends_on:
      mattermost:
        condition: service_healthy

  mattermost:
    platform: linux/amd64
    build:
      context: .
      dockerfile: mattermost/Dockerfile
    image: mattermost-incident:local
    container_name: mattermost
    volumes:
      - ./data/mattermost:/data/mattermost:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8065/api/v4/system/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 45s
