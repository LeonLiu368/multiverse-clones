schema_version = "1.2"
name = "abundant-slack-clone/slack-search-retrieval"
description = "Multi-service Slack-clone task: the agent is told only that a colleague is blocked waiting on an answer, and must find the question, retrieve the correct (non-stale) fact from the workspace, and reply. Verified deterministically via the Slack API (nop=0, oracle=1)."

[metadata]
category = "knowledge-work"
service = "slack"
tools = ["slack-cli", "slack-mcp"]
tags = ["slack-clone", "multi-service", "open-ended", "search", "retrieval", "qa"]

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
workdir = "/app"
build_timeout_sec = 1200
