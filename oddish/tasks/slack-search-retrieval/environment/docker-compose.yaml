# Data-free multi-service Oddish task: a shared slack-clone service (`slack`) seeded
# by NAME from its baked-in workspace catalog, plus the agent (`client`) with slack-cli
# + the slack-mcp MCP server. NO seed data lives in this task directory — the workspace
# 'globex-staging' comes from the image's catalog (repo-level workspaces/globex-staging.json).
#
# NOTE: no `networks:` here. The Harbor/Oddish runtime injects `network_mode` on the
# `client` service (mutually exclusive with an explicit `networks:` key) and wires
# inter-service networking itself — services still resolve each other by name
# (client -> http://slack:3000).
#
# Images are shared (built once from the repo root). The `build:` blocks are a local
# fallback so `docker compose` works from a full checkout; in a prebuilt/registry setup
# the runtime supplies the images and the build context is ignored.
services:
  client:
    image: ${APEX_TASK_DOCKER_CLIENT_IMAGE_NAME:-abundant-slack-client:latest}
    build:
      context: ../../../..
      dockerfile: docker/client.Dockerfile
    container_name: ${APEX_TASK_DOCKER_CLIENT_CONTAINER_NAME:-client}
    environment:
      - SLACK_API_URL=http://slack:3000
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      slack:
        condition: service_healthy

  slack:
    image: abundant-slack-clone:latest
    build:
      context: ../../../..
      dockerfile: docker/Dockerfile
    container_name: slack
    environment:
      - SLACK_WORKSPACE=globex-staging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
