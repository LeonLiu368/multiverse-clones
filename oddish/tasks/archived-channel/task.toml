schema_version = "1.2"
name = "abundant-mattermost/archived-channel"
description = "Observability/remediation task on a seeded Slack workspace: a channel the team relies on has been archived and vanished. The agent is told only the symptom and that it has the `slack` tool (CLI + MCP); it must explore to diagnose and restore it. Verified deterministically via the workspace API (nop=0, oracle=1)."

[metadata]
category = "knowledge-work"
service = "slack"
tools = ["slack"]
tags = ["slack", "multi-service", "observability", "diagnose-and-fix", "exploration", "cli", "mcp"]

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 600

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = true
workdir = "/app"
build_timeout_sec = 1800

# The `slack` MCP server made available to the agent (Harbor MCPServerConfig schema). The
# agent runtime launches this stdio server and auto-discovers its workspace tools.
mcp_servers = [
  { name = "slack", transport = "stdio", command = "/usr/local/bin/slack-mcp", args = [] },
]
