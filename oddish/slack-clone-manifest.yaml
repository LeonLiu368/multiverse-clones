metadata:
  name: slack-clone-tasks
  description: |
    Oddish-runnable multi-service Slack-clone tasks. Each drops the agent into a seeded
    Slack workspace served by the slack-clone (a Slack-faithful HTTP API) and gives it
    `slack-cli` to investigate and act. The verifier reads workspace state back via the
    API, so it is deterministic (nop=0, oracle=1). Tasks are self-contained: the
    slackclone package is vendored into each task's environment so `oddish run` uploads
    and builds them with no external references.
  task_path: oddish/tasks
  n_trials: 1
  skip_trajectory_analysis: false

tasks:
  - slack-incident-triage

agents:
  - name: gemini-cli
    model_name: google/gemini-3.1-flash-preview
  - name: oracle
  - name: nop
